<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url(../assets/fonts/inter-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:Mono;src:url(../assets/fonts/JetBrainsMono-700.woff2);font-weight:700}
@font-face{font-family:Serif;src:url(../assets/fonts/EBGaramond-700.woff2);font-weight:700}
*{margin:0;box-sizing:border-box}body{width:1080px;height:1920px;overflow:hidden;background:#05070b;font-family:Inter}
.bg{position:absolute;inset:0;background:url(cover-bg.jpg) center/cover}
.vg{position:absolute;inset:0;background:linear-gradient(rgba(5,7,11,.85) 0%,rgba(5,7,11,.1) 30%,rgba(5,7,11,.1) 55%,rgba(5,7,11,.9) 80%,#05070b)}
.t{position:absolute;top:160px;left:0;right:0;text-align:center;color:#f6f3ec;text-shadow:0 6px 30px rgba(0,0,0,.9)}
.k{font:800 54px Inter;letter-spacing:6px;color:#ffb36b}.big{font:800 150px/0.95 Inter;letter-spacing:-5px;margin-top:8px}.big span{color:#ff4d2e}
.box{position:absolute;top:1260px;left:0;right:0;text-align:center}
.n{font:italic 700 170px/1 Serif;color:#fff;text-shadow:0 10px 40px rgba(0,0,0,.9)}.n span{color:#ff4d2e}
.q{margin-top:26px}.q span{display:inline-block;font:800 48px Inter;color:#fff;background:#b3121f;padding:14px 30px;border-radius:12px}
.sub{font:700 24px Mono;letter-spacing:3px;color:rgba(255,255,255,.7);margin-top:20px}
</style></head><body><div class="bg"></div><div class="vg"></div>
