        box-shadow: 0 8px 28px rgba(30,40,80,0.12); transform: translateX(-50%); white-space: nowrap; }
      .hud .st { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 30px; }

      #note { position: absolute; left: 40px; top: 1645px; padding: 7px 14px; border-radius: 8px; background: rgba(255,255,255,0.8); font-weight: 500; font-size: 22px; color: #6b7183; }
      #card { position: absolute; left: 70px; top: 470px; width: 470px; padding: 26px 30px; border-radius: 22px; background: rgba(255,255,255,0.95); box-shadow: 0 14px 40px rgba(30,40,80,0.14); }
      #card .k { font-weight: 800; font-size: 22px; letter-spacing: 3px; color: #6b7183; }
      #card .big { font-weight: 800; font-size: 96px; letter-spacing: -3px; color: #14161c; line-height: 1.05; margin-top: 6px; }
      #card .sub { font-weight: 600; font-size: 30px; color: #2f5bff; }
      #card .bar { margin-top: 18px; height: 12px; border-radius: 6px; background: #e4e8f0; overflow: hidden; }
      #card .bar i { display: block; height: 100%; width: 0; background: #2f5bff; border-radius: 6px; }
      #card .barl { display: flex; justify-content: space-between; margin-top: 8px; font-weight: 600; font-size: 22px; color: #8a90a0; }
      #cmp { position: absolute; left: 40px; right: 40px; top: 420px; display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
      #cmp .col { background: rgba(255,255,255,0.96); border-radius: 26px; padding: 22px 22px 26px; box-shadow: 0 14px 40px rgba(30,40,80,0.14); }
      #cmp .lcd { background: #1d2430; border-radius: 16px; padding: 10px 18px; display: flex; justify-content: space-between; align-items: baseline; }
      #cmp .lcd b { font-weight: 800; font-size: 72px; color: #8fd0ff; letter-spacing: -2px; font-variant-numeric: tabular-nums; }
      #cmp .lcd span { font-weight: 700; font-size: 22px; letter-spacing: 3px; color: #8a96a8; }
      #cmp .k { margin-top: 18px; font-weight: 800; font-size: 20px; letter-spacing: 3px; color: #6b7183; }
      #cmp svg { display: block; width: 100%; height: 260px; margin-top: 6px; }
      #cmp .bar { margin-top: 10px; height: 18px; border-radius: 9px; background: #e4e8f0; overflow: hidden; }
      #cmp .bar i { display: block; height: 100%; width: 0; border-radius: 9px; }
      #cmp .chip { margin-top: 14px; display: inline-block; padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 24px; }
      #cta { position: absolute; left: 0; right: 0; top: 1665px; text-align: center; font-weight: 600; font-size: 34px; color: #4a5060; }
      #rew { position: absolute; right: 60px; top: 300px; font-weight: 800; font-size: 34px; letter-spacing: 2px; color: #2f5bff; }
      #captions-host { z-index: 10; }
    </style>

  <body>

        <div class="hud" id="hud-a"><div class="st"><span class="dot"></span><span class="sl"></span></div><span class="sep"></span><div><span class="val"></span><span class="unit"></span></div></div>
        <div class="hud" id="hud-b"><div class="st"><span class="dot"></span><span class="sl"></span></div><span class="sep"></span><div><span class="val"></span><span class="unit"></span></div></div>
        <div id="labels"></div>

        <div id="cmp">
          <div class="col" id="c16"><div class="lcd"><span>REMOTE</span><b>16°C</b></div><div class="k">SUHU BILIK</div>
            <svg viewBox="0 0 460 260"><line x1="40" y1="20" x2="40" y2="230" stroke="#c9cfda" stroke-width="3"/><line x1="40" y1="230" x2="450" y2="230" stroke="#c9cfda" stroke-width="3"/>
              <line class="tg" x1="40" x2="450" stroke="#2f5bff" stroke-width="3" stroke-dasharray="10 8"/><text class="tgl" x="450" text-anchor="end" font-size="22" font-weight="700" fill="#2f5bff">sasaran 16°C</text>

            <svg viewBox="0 0 460 260"><line x1="40" y1="20" x2="40" y2="230" stroke="#c9cfda" stroke-width="3"/><line x1="40" y1="230" x2="450" y2="230" stroke="#c9cfda" stroke-width="3"/>
              <line class="tg" x1="40" x2="450" stroke="#2f5bff" stroke-width="3" stroke-dasharray="10 8"/><text class="tgl" x="450" text-anchor="end" font-size="22" font-weight="700" fill="#2f5bff">sasaran 24°C</text>
              <polyline class="ln" fill="none" stroke="#22a95b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>

    <script>
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      let resolveWorld;
      window.__hf.buildReady["world"] = new Promise((r) => (resolveWorld = r));
    </script>
    <script type="module">
      import { createWorld } from "./assets/world.js";
      import { warp } from "./assets/timing.js";
      const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
      const scale = Number(vars.previewScale) || 1;
      await Promise.all(["500", "600", "700", "800"].map((w) => document.fonts.load(`${w} 40px "Inter"`)));
      let fxOpts = {}; try { fxOpts = vars.fx ? JSON.parse(vars.fx) : {}; } catch (e) {}
      const world = createWorld(document.getElementById("world-canvas"), 1080, 1920, scale, fxOpts);
      const T = world.T;

      const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
      const ss = (e0, e1, x) => { const u = clamp((x - e0) / (e1 - e0)); return u * u * (3 - 2 * u); };
      const win = (t, t0, t1, fin = 0.3, fout = 0.3) => (t0 <= 0 ? 1 : ss(t0, t0 + fin, t)) * (t1 >= 60 ? 1 : 1 - ss(t1 - fout, t1, t));

      const HOOK = "Aircond <em>tak buat sejuk</em>";
      const CH = [
        [0, 3.0, HOOK], [3.0, 8, "Dia cuma <em>pindah panas</em>"], [8, 12, "Satu gelung <em>gas penyejuk</em>"], [12, 19, "Dalam bilik: <em>serap haba</em>"],
        [19, 28, "Kat luar: <em>picit, buang haba</em>"], [28, 34, "Injap: <em>tekanan jatuh</em>"], [34, 41, "Air menitis? <em>Bukan bocor</em>"],
        [41, 52, "16°C <em>tak lebih cepat</em>"], [52, 58.8, "Mesin <em>pindah panas</em>"], [58.8, 60, HOOK],
      ];
      const NOTES = [[8.2, 12, "Gas penyejuk biasa di Malaysia: R32 / R410A"], [19.2, 28, "Kompresor dilukis ringkas · aircond rumah lazimnya jenis rotari"],
        [41.3, 52, "Ilustrasi · laju sejuk dihadkan kapasiti aircond, bukan suhu pada remote"]];
      const LABELS = [
        ["in.unit", "UNIT DALAM", 1.6, 5.0, 1], ["out.unit", "UNIT LUAR", 2.4, 7.4, 1],
        ["pipe", "GAS PENYEJUK", 9.8, 11.9, -1],
        ["evap", "GEGELUNG SEJUK", 13.0, 18.8, -1], ["intake", "UDARA BILIK", 15.6, 18.8, -1],
        ["comp", "KOMPRESOR", 20.2, 27.8, -1], ["fan", "KIPAS", 26.0, 27.8, 1],
        ["valve", "INJAP", 29.5, 33.4, -1],
        ["drips", "WAP AIR BILIK", 37.2, 40.8, -1],
        ["kau", "KAU", 55.4, 59.5, -1], ["jiran", "JIRAN", 57.0, 59.5, 1],
      ];
      const ST = { room: ["Bilik", "#2f5bff"], outair: ["Angin luar", "#e5483a"], cold: ["Gas sejuk", "#2f5bff"], hot: ["Gas panas", "#e5483a"] };

      const $ = (s) => document.querySelector(s);
      const titleEl = $("#title"), noteEl = $("#note"), labelsEl = $("#labels"), cta = $("#cta"), rew = $("#rew"), cmp = $("#cmp");
      const lblEls = LABELS.map(() => { const d = document.createElement("div"); d.className = "lbl"; d.innerHTML = '<span class="ln"></span><span class="pt"></span><span class="tx"></span>'; labelsEl.appendChild(d); return d; });
      function setHud(el, st, val, unit, x, y, a) {
        el.style.opacity = a; el.style.left = x + "px"; el.style.top = y + "px";
        const [name, col] = ST[st]; el.querySelector(".dot").style.background = col; el.querySelector(".dot").style.boxShadow = `0 0 0 5px ${col}22`;
        el.querySelector(".sl").textContent = name; el.querySelector(".sl").style.color = col;
        el.querySelector(".val").textContent = val; el.querySelector(".unit").textContent = unit;
      }
      const fmt = (v, d = 1) => v.toFixed(d).replace(".", ",");
      // comparison graph: same cooling speed until 24°C; 24 stops there, 16 keeps the compressor running
      const yOf = (T) => 230 - (T - 14) / (32 - 14) * 210;
      const roomT = (u, target) => { const reach = 0.5; const T = 31 - 7 * Math.min(u / reach, 1); if (u <= reach) return T; return target === 24 ? 24 : 24 - 2.2 * ((u - reach) / (1 - reach)); };
      for (const [id, tg] of [["#c16", 16], ["#c24", 24]]) { const el = $(id); el.querySelector(".tg").setAttribute("y1", yOf(tg)); el.querySelector(".tg").setAttribute("y2", yOf(tg)); el.querySelector(".tgl").setAttribute("y", yOf(tg) - 8); }

      function overlay(o, t) {
        const ch = CH.find(([a, b]) => t >= a && t < b) || CH[CH.length - 1];
        const hard = ch[1] === 3.0 || ch[0] === 3.0;
        const ta = hard ? 1 : win(t, ch[0], ch[1], 0.35, 0.3);
        if (titleEl.innerHTML !== ch[2]) titleEl.innerHTML = ch[2];
        titleEl.style.opacity = ta; titleEl.style.filter = `blur(${(1 - ta) * 10}px)`;
        // two pills (room / outdoor air) for the wide shots; one gas pill for the close-ups
        const wide = (t < 12 ? 1 - ss(11.6, 12.0, t) : 0) + (t >= 52.4 ? ss(52.4, 53.0, t) : 0);
        const pa = o.anchors["room.top"], pb = o.anchors["out.top"];
        setHud($("#hud-a"), "room", fmt(24), "°C", pa ? clamp(pa[0], 210, 870) : 300, 560, wide);
        setHud($("#hud-b"), "outair", fmt(45), "°C", pb ? clamp(pb[0], 210, 870) : 800, 660, wide);
        let ma = 0, st = "cold";
        if (t >= 12 && t < 34) { ma = ss(12, 12.5, t) * (1 - ss(33.6, 34, t)); st = o.gas > 30 ? "hot" : "cold"; }
        setHud($("#hud-main"), st, fmt(o.gas), "°C", 540, 300, ma);
        LABELS.forEach(([k, txt, t0, t1, side], i) => {
          const el = lblEls[i], p = o.anchors[k]; const la = p ? win(t, t0, t1, 0.25, 0.25) : 0;
          el.style.opacity = la; if (la <= 0) return;
          el.style.left = p[0] + "px"; el.style.top = p[1] + "px";
          const L = 110 * ss(t0, t0 + 0.35, t);
          const ln = el.querySelector(".ln"), tx = el.querySelector(".tx");
          ln.style.width = L + "px"; ln.style.left = side > 0 ? "0px" : -L + "px";
          if (tx.textContent !== txt) tx.textContent = txt;
          tx.style.left = side > 0 ? L + "px" : "auto"; tx.style.right = side > 0 ? "auto" : L + "px";
        });
        const n = NOTES.find(([a, b]) => t >= a && t < b);
        noteEl.style.opacity = n ? win(t, n[0], n[1]) : 0; if (n && noteEl.textContent !== n[2]) noteEl.textContent = n[2];
        // comparison card
        const ca = win(t, 41.3, 51.9, 0.4, 0.4); cmp.style.opacity = ca; cmp.style.transform = `translateY(${(1 - ss(41.3, 41.8, t)) * 30}px)`;
        const gu = ss(42.6, 49.6, t);
        for (const [id, tg] of [["#c16", 16], ["#c24", 24]]) { const el = $(id); const pts = [];
          for (let k = 0; k <= 60; k++) { const u = (k / 60) * gu; pts.push(`${(40 + u * 410).toFixed(1)},${yOf(roomT(u, tg)).toFixed(1)}`); }
          el.querySelector(".ln").setAttribute("points", pts.join(" "));
          const work = tg === 16 ? gu : Math.min(gu, 0.5) / 1.0; el.querySelector(".bar i").style.width = (100 * work) + "%";
          el.querySelector(".chip").style.opacity = ss(tg === 16 ? 48.4 : 49.9, (tg === 16 ? 48.4 : 49.9) + 0.4, t);
          el.style.boxShadow = tg === 24 ? `0 14px 40px rgba(30,40,80,0.14), 0 0 0 ${6 * ss(49.9, 50.4, t)}px #22a95b` : "0 14px 40px rgba(30,40,80,0.14)"; }
        cta.style.opacity = 0; rew.style.opacity = 0;
      }
      function renderAt(t) { const ct = warp(t); const o = world.render(ct); overlay(o, ct); }
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      renderAt(0);
      resolveWorld();
    </script>
