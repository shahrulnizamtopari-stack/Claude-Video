const myl = g.layer("malaysia", 2, { lon0: 99, lon1: 120, lat0: 0, lat1: 8, ppd: 160 });
{ const L = borders, c = L.ctx; c.strokeStyle = "rgba(255,255,255,.5)"; c.lineWidth = 2; c.lineJoin = "round";

{ const L = red, c = L.ctx; c.save(); L.path(CN.geometry); c.clip("evenodd");
  c.fillStyle = "rgba(190,18,40,.6)"; c.fillRect(0, 0, L.OW, L.OH);

{ const L = myl, c = L.ctx; c.save(); L.path(MY.geometry); c.clip("evenodd");
  const x0 = L.ox(99.5), x1 = L.ox(119.4), y0 = L.oy(7.5), y1 = L.oy(0.8), sh = (y1 - y0) / 14;

  c.fillStyle = "rgba(1,0,102,.78)"; c.fillRect(x0, y0, (x1 - x0) * 0.5, sh * 8);

// ---------------- ribbons ----------------
// Nine-dash line: China has never published coordinates; these are approximate, traced from the 2009 map.
const DASH = [[108.2, 17.6], [109.6, 14.2], [109.5, 10.3], [110.4, 6.8], [112.3, 4.1], [115.3, 6.6], [117.3, 9.9], [118.9, 14.6], [119.9, 18.6]];

const K = [

  [T.direbut, -0.16, 0.6], [T.trilion, -0.14, 0.8], [T.my, -0.12, 0.7], [T.sembilan, 0.10, 0.6],

  [T.tiada, -0.12, 0.6], [T.k100, -0.16, 0.7], [T.sarawak2, -0.12, 0.4], [T.kita, 0.10, 0.8],

function zoomMod(t) {
  let m = 0;
  for (const [a, amt, hold] of ZP) {
    const x = t - a + 0.08; if (x < 0 || x > hold + 1.6) continue;
    const up = ease(clamp(x / 0.3)), down = 1 - ease(clamp((x - 0.3 - hold) / 1.3));
    m += amt * up * down;

}

  let i = 0; while (i < K.length - 2 && t > K[i + 1][0]) i++;
  const A = K[i], B = K[i + 1], u = ease(clamp((t - A[0]) / (B[0] - A[0])));

  // fly "up" a little between far-apart views
  const hop = Math.sin(Math.PI * u) * Math.min(0.6, Math.hypot(B[1] - A[1], B[2] - A[2]) * 0.04) * (Math.abs(B[3] - A[3]) < 1 ? 1 : 0);
  const d = Math.exp(Math.log(A[3]) + (Math.log(B[3]) - Math.log(A[3])) * u) + hop;
  return { lat: L(1), lon: L(2), dist: d * zoomMod(t), tilt: L(4), yShift: L(5) };
}

});

const media = (key, prompt) => MEDIA[key]
  ? `<div class="media" style="padding:0"><video src="${MEDIA[key]}" muted playsinline style="width:100%;height:100%;object-fit:cover"></video><span class="il">ILUSTRASI</span></div>`
  : `<div class="media">B-ROLL · FLOW AI<em>${prompt}</em><span class="il">ILUSTRASI</span></div>`;
const card = (top, outlet, date, head, foot, med) => mk(cardWrap, "card", `<div class="hd"><b>${outlet}</b><i>${date}</i></div><div class="bd">${head}<div class="ft">${foot}</div></div>${med || ""}`);
const stat = (top, k, n, u) => mk(cardWrap, "stat", `<div class="k">${k}</div><div><div class="n"><span class="v">${n}</span><div class="strike"></div></div></div><div class="u">${u}</div><div class="bar"><div></div></div>`);
const C = {
  trade: stat(0, "DAGANGAN MELALUI LAUT INI", "$0", "SETAHUN · ANGGARAN CSIS"),
  nine: card(0, "9 GARIS PUTUS", "TUNTUTAN CHINA", `Ditolak tribunal antarabangsa, <mark>The Hague, 2016</mark>`, "Timbang tara Filipina lwn China · PCA"),
  km: stat(0, "JARAK DARI PANTAI SARAWAK", "0", "KILOMETER"),
  fmt: card(0, "FREE MALAYSIA TODAY", "1 JAN 2026", `<mark>Armed forces monitoring Chinese vessel</mark> at South Luconia Shoals`, "Tajuk asal · freemalaysiatoday.com", media("navy", "kapal TLDM membayangi kapal pengawal pantai, laut lepas, mendung")),
  coc: card(0, "KOD TATALAKU", "ASEAN + CHINA", `Peraturan bersama supaya <mark>tiada konflik</mark> di Laut China Selatan`, "Code of Conduct (COC)"),
  y26: stat(0, "SASARAN SIAP", "2026", "HUJUNG TAHUN"),
  upi: card(0, "UPI", "16 NOV 2026", `<mark>ASEAN, China fail to finalize</mark> South China Sea code of conduct`, "Tajuk asal · upi.com"),
  p80: stat(0, "DRAF DIPERSETUJUI", "0%", "PERENGGAN DRAF"),
  mm: card(0, "MALAY MAIL", "17 NOV 2026", `<mark>No new deadline set</mark> for South China Sea code negotiations, says Anwar`, "Tajuk asal · malaymail.com"),
  rt: card(0, "REUTERS", "12 NOV 2026", `China stages unannounced Pacific drills in <mark>'silent intimidation'</mark> of Taiwan`, "Tajuk asal · reuters.com · kata pegawai Taiwan", media("fleet", "armada kapal perang di laut terbuka, dari udara, senja")),
};
const stampNine = document.createElement("div"); stampNine.className = "stamp"; stampNine.textContent = "CHINA: TAK TERIMA"; stampNine.style.cssText += "right:26px;bottom:-14px"; C.nine.querySelector(".bd").appendChild(stampNine);
const stampY = document.createElement("div"); stampY.className = "stamp"; stampY.textContent = "TERLEPAS"; stampY.style.cssText += "right:40px;top:40px"; C.y26.appendChild(stampY);
// schedule: [el, a, b, top]
const SCH = [
  [C.trade, T.trilion - 0.15, T.cn - 0.15, 1060], [C.nine, T.tahun2016, T.garisan2 - 0.1, 1150], [C.km, T.km80 - 0.2, T.patinggi - 0.15, 1090],
  [C.fmt, T.kapal, T.sebab - 0.1, 950], [C.coc, T.kod - 0.1, T.sasaran - 0.1, 1150], [C.y26, T.sasaran, T.p80 - 0.15, 1120],
  [C.upi, T.minggu, T.anwar - 0.15, 860], [C.p80, T.p80 - 0.1, T.anwar - 0.15, 1230], [C.mm, T.anwar, T.dalam - 0.1, 1120],
  [C.rt, T.pegawai - 0.2, T.lautni - 0.1, 960],
];
const HL = [[C.nine, T.hague - 0.25, T.tolak + 0.2], [C.fmt, T.kapal + 0.3, T.berlegar], [C.coc, T.peraturan, T.peraturan + 1.3],
            [C.upi, T.terlepas - 0.3, T.terlepas + 0.6], [C.mm, T.tiada - 0.1, T.tiada + 1.0], [C.rt, T.k100, T.k100 + 1.1]];

// captions
const capEl = document.getElementById("cap");
const capSpans = CAPS.map((c) => c.w.map((w, i) => { const s = document.createElement("span"); s.textContent = w.t + (i < c.w.length - 1 ? " " : ""); return s; }));

// screen-space fx canvas: ships, pulses
const fx = document.getElementById("fx").getContext("2d");
let seed = 5; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const SHIPS = []; for (let i = 0; SHIPS.length < 110 && i < 400; i++) { const lo = 119.6 + rnd() * 8.4, la = 18.4 + rnd() * 9.4;
  if (lo < 122.3 && la > 21.7 && la < 25.5) continue; if (lo < 121 && la > 24.5) continue; SHIPS.push([la, lo, rnd(), rnd() * 6.28]); }
function drawShip(x, y, rot, col, s = 1) { fx.save(); fx.translate(x, y); fx.rotate(rot); fx.fillStyle = col; fx.beginPath();
  fx.moveTo(12 * s, 0); fx.lineTo(-8 * s, -5 * s); fx.lineTo(-8 * s, 5 * s); fx.closePath(); fx.fill(); fx.restore(); }

const hook = document.getElementById("hook"), outro = document.getElementById("outro"), fade = document.getElementById("fade"), tint = document.getElementById("tint");
document.getElementById("chan").textContent = BRAND.name; document.getElementById("handle").textContent = BRAND.handle;
const fbtn = document.getElementById("fbtn");

function renderAt(t) {
  // camera + globe layers
  const v = cam(t); g.setView(v);
  g.layers.china.mesh.material.opacity = Math.max(win(t, T.direbut, T.lcs - 0.2, 0.5, 0.5), win(t, T.cn3, T.garisan2 + 0.3, 0.5, 0.6), win(t, T.asean, T.lautni, 0.6, 0.8));
  g.layers.malaysia.mesh.material.opacity = Math.max(win(t, T.malaysia1, T.lcs, 0.3, 0.5), win(t, T.my, T.tapi, 0.3, 0.4), win(t, T.garisan2, T.sebab + 0.4, 0.8, 0.6), win(t, T.pintu, DURATION, 0.6, 0.6)) * 0.95;
  g.layers.borders.mesh.material.opacity = 0.6 + 0.4 * clamp((t - 3) / 2);
  dashes.forEach((d, i) => {
    const hookOn = win(t, T.direbut + 0.12 * i, T.lcs - 0.3, 0.2, 0.5);
    const mainOn = win(t, T.sembilan + 0.16 * i, T.lautni + 0.3, 0.18, 0.8) * (t > T.pintu ? 0.55 : 1);
    const o = Math.max(hookOn, mainOn), pop = 1 + 0.6 * (1 - clamp((t - (T.sembilan + 0.16 * i)) / 0.3)) * (t > T.sembilan + 0.16 * i ? 1 : 0);
    d.core.u.op.value = o; d.glow.u.op.value = o * (0.8 + 0.2 * Math.sin(t * 4 + i));
    d.core.u.w.value *= pop;
  });
  lanes.forEach((l, i) => { l.u.op.value = win(t, T.setiap + 0.1 * i, T.cn - 0.2, 0.4, 0.4); l.u.off.value = t * 1.8; l.u.prog.value = eout((t - T.setiap) / 1.4); });
  km.u.op.value = win(t, T.lebih, T.patinggi - 0.2, 0.2, 0.3); km.u.prog.value = eout((t - T.lebih) / 0.8);
  kdPath.u.op.value = win(t, T.kd, T.sebab, 0.3, 0.3) * 0.9; kdPath.u.prog.value = eout((t - T.kd) / 2.2); kdPath.u.off.value = -t * 1.2;
  g.render();

  // pins
  for (const p of PINS) {
    const k = win(t, p.a, p.b, 0.25, 0.25);
    if (k <= 0) { p.el.style.display = "none"; continue; }
    const s = g.project(p.ll[0], p.ll[1]);
    if (!s.visible || s.x < -200 || s.x > W + 200 || s.y < -100 || s.y > H + 100) { p.el.style.display = "none"; continue; }
    p.el.style.display = "flex"; p.el.style.left = s.x + "px"; p.el.style.top = s.y + "px"; p.el.style.opacity = k;
    const pop = p.k === "flag" ? 0.6 + 0.4 * eout(clamp((t - p.a) / 0.25)) + 0.08 * Math.sin(clamp((t - p.a) / 0.35) * Math.PI) : 1;
    const base = p.k === "flag" ? "translate(-50%,-100%)" : p.k === "loc" ? "translate(-13px,-50%)" : "translate(-50%,-50%)";
    p.el.style.transform = `${base} scale(${pop})`;
  }

  // cards
  for (const [el, a, b, top] of SCH) {
    const k = win(t, a, b, 0.3, 0.25);
    if (k <= 0) { el.style.display = "none"; continue; }
    el.style.display = "block"; el.style.opacity = k;
    el.style.top = top + 50 * (1 - eout((t - a) / 0.4)) + "px";
  }
  for (const [el, a, b] of HL) for (const m of el.querySelectorAll("mark")) m.style.backgroundSize = `${100 * clamp((t - a) / (b - a))}% 100%`;
  // stat values
  const cnt = (el, a, d, to, fmt) => { const u = eout((t - a) / d); el.querySelector(".v").textContent = fmt(to * u); el.querySelector(".bar div").style.width = 100 * u * (el.dataset.bar || 1) + "%"; };
  C.trade.dataset.bar = 0.85; cnt(C.trade, T.trilion, 0.9, 3.4, (x) => "$" + x.toFixed(1) + "T");
  C.km.dataset.bar = 0.4; cnt(C.km, T.km80 - 0.1, 0.7, 80, (x) => Math.round(x));
  C.p80.dataset.bar = 0.8; cnt(C.p80, T.p80, 0.8, 80, (x) => Math.round(x) + "%");
  C.y26.querySelector(".bar div").style.width = 100 * eout((t - T.sasaran) / 3.6) + "%";
  C.y26.querySelector(".strike").style.transform = `scaleX(${eout((t - T.terlepas) / 0.25)})`;
  C.p80.querySelector(".u").textContent = t >= T.isu ? "ISU PALING BESAR · BELUM" : "PERENGGAN DRAF";
  C.p80.querySelector(".u").style.color = t >= T.isu ? "#ff2d46" : "#fff";
  const slam = (el, at) => { const u = clamp((t - at) / 0.22); el.style.display = t >= at ? "block" : "none"; el.style.transform = `rotate(-8deg) scale(${1.7 - 0.7 * eout(u)})`; el.style.opacity = u; };
  slam(stampNine, T.takterima); slam(stampY, T.terlepas);

  // fx canvas
  fx.clearRect(0, 0, W, H);
  const ccgOn = win(t, T.kapal, T.sebab, 0.3, 0.3);
  if (ccgOn > 0) {
    const s = g.project(5.25, 112.35); const r = 22 + 30 * ((t * 0.9) % 1);
    fx.globalAlpha = ccgOn * (1 - ((t * 0.9) % 1)); fx.strokeStyle = "#ff2d46"; fx.lineWidth = 3; fx.beginPath(); fx.arc(s.x, s.y, r, 0, 7); fx.stroke();
    fx.globalAlpha = ccgOn; drawShip(s.x, s.y, -0.3, "#ff2d46", 1.6);
    fx.font = "700 18px Mono"; fx.fillStyle = "#ff2d46"; fx.fillText("CCG", s.x + 22, s.y - 14);
  }
  const kdOn = win(t, T.kd, T.sebab, 0.3, 0.3);
  if (kdOn > 0) {
    const u = eout((t - T.kd) / 2.2), P = [[4.25, 113.75], [4.75, 113.2], [5.05, 112.75]];
    const seg = u < 0.5 ? 0 : 1, uu = u < 0.5 ? u / 0.5 : (u - 0.5) / 0.5;
    const la = P[seg][0] + (P[seg + 1][0] - P[seg][0]) * uu, lo = P[seg][1] + (P[seg + 1][1] - P[seg][1]) * uu;
    const s = g.project(la, lo), s2 = g.project(P[seg + 1][0], P[seg + 1][1]);
    fx.globalAlpha = kdOn; drawShip(s.x, s.y, Math.atan2(s2.y - s.y, s2.x - s.x), "#9fd4ff", 1.6);
    fx.font = "700 18px Mono"; fx.fillStyle = "#cfe9ff"; fx.fillText("KD KELANTAN", s.x + 20, s.y + 30);
  }
  const shipsOn = win(t, T.k100 - 0.2, T.lautni + 0.2, 0.2, 0.5);
  if (shipsOn > 0) {
    fx.shadowColor = "#ff2d46"; fx.shadowBlur = 8;
    for (const [la, lo, d, rot] of SHIPS) {
      const k = clamp((t - (T.k100 - 0.2 + d * 1.3)) / 0.2) * shipsOn; if (k <= 0) continue;
      const s = g.project(la + 0.15 * Math.sin(t * 0.3 + rot), lo + 0.25 * (t - T.k100) * 0.1); fx.globalAlpha = k; drawShip(s.x, s.y, rot, "#ff2d46", 0.9);
    }
    fx.shadowBlur = 0;
  }
  fx.globalAlpha = 1;

  // captions
  let ci = -1; for (let i = 0; i < CAPS.length; i++) if (t >= CAPS[i].a && t < CAPS[i].b) ci = i;
  const hookOn = t < T.lcs - 0.1 && t > 0;
  if (ci < 0 || hookOn || t > T.end_vo + 0.6) capEl.style.display = "none";
  else {
    capEl.style.display = "block";
    if (capEl.dataset.i != ci) { capEl.innerHTML = ""; capSpans[ci].forEach((s) => capEl.appendChild(s)); capEl.dataset.i = ci; }
    CAPS[ci].w.forEach((w, j) => { const s = capSpans[ci][j]; s.style.color = t >= w.at - 0.03 ? (w.k ? "#ff2d46" : "#fff") : "rgba(255,255,255,.36)"; });
  }

  // hook title
  const hk = win(t, 0.05, T.lcs - 0.35, 0.2, 0.3);
  hook.style.display = hk > 0 ? "block" : "none"; hook.style.opacity = hk;
  const [ha, hb, hc, hl] = hook.children;
  ha.style.opacity = clamp((t - 0.1) / 0.25); ha.style.transform = `translateY(${20 * (1 - eout((t - 0.1) / 0.3))}px)`;
  const ub = clamp((t - (T.direbut - 0.05)) / 0.2); hb.style.opacity = ub; hb.style.transform = `scale(${1.45 - 0.45 * eout(ub)})`;
  hc.style.opacity = clamp((t - T.enam) / 0.2); hl.style.transform = `scaleX(${eout((t - T.enam) / 0.5)})`;

  // red pulse on key moments
  tint.style.opacity = 0.7 * Math.max(win(t, T.direbut, T.direbut + 0.3, 0.05, 0.5), win(t, T.terlepas, T.terlepas + 0.3, 0.05, 0.6), win(t, T.k100, T.k100 + 0.4, 0.1, 0.8), win(t, T.takterima, T.takterima + 0.2, 0.05, 0.5));

  // outro
  const ot = T.end_vo + 0.4, ok = win(t, ot, DURATION + 1, 0.4, 0.1);
  outro.style.display = ok > 0 ? "block" : "none"; outro.style.opacity = ok;
  const box = outro.firstElementChild; box.style.transform = `translateY(${40 * (1 - eout((t - ot) / 0.5))}px)`;
  const followed = t > ot + 1.6; fbtn.textContent = followed ? "Following" : "Follow"; fbtn.style.background = followed ? "#2a2f38" : "#ff2d46";
  fade.style.opacity = clamp((t - (DURATION - 0.45)) / 0.4);
}
window.__renderAt = renderAt;
window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
tl.to({}, { duration: DURATION }, 0);
window.__timelines["main"] = tl;
renderAt(0);
resolveWorld();
</script>
