  const L = (k) => A[k] + (B[k] - A[k]) * u;
  const hop = Math.sin(Math.PI * u) * Math.min(0.6, Math.hypot(B[1] - A[1], B[2] - A[2]) * 0.04) * (Math.abs(B[3] - A[3]) < 1 ? 1 : 0);
  const d = Math.exp(Math.log(A[3]) + (Math.log(B[3]) - Math.log(A[3])) * u) + hop;
  return { lat: L(1), lon: L(2), dist: d * zoomMod(t), tilt: L(4), yShift: L(5) };
}

// ---------------- HTML ----------------
const pinWrap = document.getElementById("pins"), cardWrap = document.getElementById("cards");
const mk = (parent, cls, html) => { const e = document.createElement("div"); e.className = "el " + cls; e.innerHTML = html; parent.appendChild(e); return e; };

const S39 = stamp("SEKSYEN 39B · ADB 1952", 54), SJAM = stamp("TIADA JAMINAN", 64), SBER = stamp("DIDAKWA ≠ BERSALAH", 62);

const hook = document.getElementById("hook"), outro = document.getElementById("outro"), fade = document.getElementById("fade"), tint = document.getElementById("tint");

document.getElementById("fx").style.display = "none";

// framed FLOW B-roll windows (timing lives on the <video> tags)
const BR = ["mahkamah", "gavel", "gari"].map((k) => { const v = document.getElementById("v-" + k);
  return { w: document.getElementById("bw-" + k), a: +v.dataset.start, b: +v.dataset.start + +v.dataset.duration }; });
const brollEl = document.getElementById("broll"), vigEl = document.querySelector(".vig");
function brollAt(t) {
  let on = 0;
  for (const c of BR) { const k = win(t, c.a, c.b - 0.2, 0.2, 0.2); on = Math.max(on, k);
    c.w.style.opacity = k > 0 ? 1 : 0; c.w.style.transform = `scale(${1.02 + 0.06 * clamp((t - c.a) / (c.b - c.a))})`; }
  brollEl.style.opacity = on; brollEl.style.transform = `scale(${0.86 + 0.14 * eout(on)})`;
  vigEl.style.opacity = 1 - on * 0.3; pinWrap.style.opacity = 1 - on;
}
const show = (el, t, a, b, top, disp = "block") => {
  const k = win(t, a, b, 0.3, 0.25);
  if (k <= 0) { el.style.display = "none"; return 0; }
  el.style.display = disp; el.style.opacity = k; if (top != null) el.style.top = top + 50 * (1 - eout((t - a) / 0.4)) + "px"; return k;
};
const popIcons = (els, t, a, step) => els.forEach((e, i) => { const u = clamp((t - a - i * step) / 0.2); e.style.opacity = u; e.style.transform = `scale(${0.4 + 0.6 * eout(u)})`; });
const slam = (el, t, a, b, x, y, rot = -8) => {

  el.style.display = on > 0 ? "block" : "none"; el.style.left = x + "px"; el.style.top = y + "px"; el.style.opacity = on;
  el.style.transform = `rotate(${rot}deg) scale(${1.7 - 0.7 * eout(u)})`;
};

function renderAt(t) {
  brollAt(t);
  const v = cam(t); g.setView(v); g.render();

  for (const p of PINS) {
    const k = win(t, p.a, p.b, 0.25, 0.25);
    if (k <= 0) { p.el.style.display = "none"; continue; }
    const s = g.project(p.ll[0], p.ll[1]);
    if (!s.visible) { p.el.style.display = "none"; continue; }
    p.el.style.display = "flex"; p.el.style.left = s.x + "px"; p.el.style.top = s.y + "px"; p.el.style.opacity = k;
    const pulse = p.red ? 1 + 0.06 * Math.sin(t * 6) : 1;
    p.el.style.transform = `translate(-13px,-50%) scale(${(0.7 + 0.3 * eout((t - p.a) / 0.25)) * pulse})`;
  }

  for (const [el, a, b, top] of SCH) show(el, t, a, b, top);
  for (const [el, a, b] of HL) for (const m of el.querySelectorAll("mark")) m.style.backgroundSize = `${100 * clamp((t - a) / (b - a))}% 100%`;

  // part tag
  { const k = Math.max(win(t, 0.1, T.ingat - 0.3, 0.3, 0.3), win(t, T.ingat - 0.1, T.jumaat - 0.2, 0.3, 0.3));
    part.style.display = k > 0 ? "block" : "none"; part.style.opacity = k; part.textContent = t < T.ingat - 0.2 ? "PART 2 · KES 96 KG TUDM" : "IMBAS KEMBALI · PART 1"; }
  // recap: bags, then 11 arrested
  if (show(bags, t, T.lima - 0.1, T.jumaat - 0.2, 820) > 0) popIcons(bagEls, t, T.lima - 0.1, 0.08);
  if (show(P1, t, T.polis - 0.1, T.jumaat - 0.2, 1110) > 0) { popIcons(P1i, t, T.s11 - 0.25, 0.05); P1g[0].style.opacity = clamp((t - T.s11) / 0.3); P1g[1].style.opacity = clamp((t - T.s11 - 0.2) / 0.3); }
  // court photo with slow push, then stat 96.2
  if (show(photo, t, T.shah - 0.1, T.tiga1 - 0.15, 330) > 0) photoImg.style.transform = `scale(${1.02 + 0.08 * clamp((t - T.shah) / 5)})`;
  if (show(stat, t, T.mengedar - 0.2, T.tiga1 - 0.15, 920) > 0) {
    const u = eout((t - T.k962 + 0.2) / 1.0); stat.querySelector(".v").textContent = (96.2 * u).toFixed(1);
    stat.querySelector(".bar div").style.width = 100 * u * 0.97 + "%";
  }
  // accused grid
  if (show(ACC, t, T.tiga1 - 0.1, T.pertuduhan - 0.15, 1000) > 0) {
    popIcons(accO, t, T.tiga1 - 0.05, 0.1); popIcons(accC, t, T.tiga2 - 0.05, 0.1);
    accO.forEach((e, i) => { e.querySelector("b").style.opacity = clamp((t - (i < 2 ? T.leftenan : T.kapten) + 0.1) / 0.25); e.querySelector("i").style.opacity = clamp((t - T.berumur) / 0.3); });
    accC.forEach((e) => { e.querySelector("b").style.opacity = clamp((t - T.awam + 0.2) / 0.25); });
    accG[0].style.opacity = clamp((t - T.pegawai) / 0.3); accG[1].style.opacity = clamp((t - T.awam) / 0.3);
  }
  slam(S39, t, T.seksyen, T.kalau - 0.5, 250, 760, -5);
  // penalty
  if (show(PEN, t, T.kalau - 0.1, T.tiada - 0.2, 1210) > 0) {
    penO1.style.opacity = clamp((t - T.mati + 0.1) / 0.2); penO1.style.transform = `scale(${1.3 - 0.3 * eout((t - T.mati + 0.1) / 0.25)})`;
    penOr.style.opacity = clamp((t - T.mati - 0.25) / 0.2); penO2.style.opacity = clamp((t - T.penjara + 0.1) / 0.25);
  }
  // court process timeline
  { const k = win(t, T.tiada - 0.1, T.s11b - 0.2, 0.3, 0.3);
    tlEl.style.display = k > 0 ? "flex" : "none"; tlEl.style.opacity = k;
    if (k > 0) { let now = -1; TL2.forEach(([, , at], i) => { if (t >= at) now = (now < 0 || at >= TL2[now][2]) ? i : now; });

  // 11 vs 6
  if (show(P3, t, T.s11b - 0.1, T.ingat2 - 0.1, 1000) > 0) {
    popIcons(P3i.slice(0, 6), t, T.six3 - 0.2, 0.06); popIcons(P3i.slice(6), t, T.status - 0.1, 0.06);

  }
  // closing: stamp, comment bubbles
  slam(SBER, t, T.didakwa3, T.end_vo + 0.3, 220, 620);
  BUB.forEach((e, i) => { const a = T.pada + i * 0.5, k = win(t, a, T.end_vo + 0.3, 0.2, 0.3);
    e.style.display = k > 0 ? "block" : "none"; e.style.opacity = k; e.style.transform = `scale(${0.6 + 0.4 * eout((t - a) / 0.25)})`; });
  { const k = win(t, T.komen - 0.1, T.end_vo + 0.3, 0.2, 0.3); KOM.style.display = k > 0 ? "block" : "none"; KOM.style.opacity = k;
    KOM.style.transform = `translateY(${10 * Math.sin(t * 8)}px)`; }

  // captions
  let ci = -1; for (let i = 0; i < CAPS.length; i++) if (t >= CAPS[i].a && t < CAPS[i].b) ci = i;
  const hookOn = t < T.ingat - 0.15;
  if (ci < 0 || hookOn || t > T.end_vo + 0.6) capEl.style.display = "none";
  else {
    capEl.style.display = "block";
    if (capEl.dataset.i != ci) { capEl.innerHTML = ""; capSpans[ci].forEach((s) => capEl.appendChild(s)); capEl.dataset.i = ci; }
    CAPS[ci].w.forEach((w, j) => { const s = capSpans[ci][j]; s.style.color = t >= w.at - 0.03 ? (w.k ? "#ff2d46" : "#fff") : "rgba(255,255,255,.36)"; });

  const hk = win(t, 0.05, T.ingat - 0.3, 0.2, 0.3);
  hook.style.display = hk > 0 ? "block" : "none"; hook.style.opacity = hk;
  const [hb, hc, ha, hl] = hook.children;
  const ub = clamp((t - T.six1 + 0.05) / 0.2); hb.style.opacity = ub; hb.style.transform = `scale(${1.45 - 0.45 * eout(ub)})`;
  const uc = clamp((t - T.didakwa1 + 0.05) / 0.2); hc.style.opacity = uc; hc.style.transform = `scale(${1.25 - 0.25 * eout(uc)})`;
  ha.style.opacity = clamp((t - T.kes) / 0.3); ha.style.transform = `translateY(${20 * (1 - eout((t - T.kes) / 0.4))}px)`;
  hl.style.transform = `scaleX(${eout((t - T.tudm1 + 0.3) / 0.6)})`;

  tint.style.opacity = Math.max(0.7 * win(t, T.six1, T.six1 + 0.3, 0.05, 0.5), 0.5 * win(t, T.k962, T.k962 + 0.3, 0.05, 0.6),
    0.6 * win(t, T.mati, T.mati + 0.6, 0.05, 0.8), 0.4 * win(t, T.jamin, T.jamin + 0.3, 0.05, 0.5), 0.6 * win(t, T.didakwa3, T.didakwa3 + 0.3, 0.05, 0.6));

  const ot = T.end_vo + 0.4, ok = win(t, ot, DURATION + 1, 0.4, 0.1);
  outro.style.display = ok > 0 ? "block" : "none"; outro.style.opacity = ok;
  outro.firstElementChild.style.transform = `translateY(${40 * (1 - eout((t - ot) / 0.5))}px)`;
  const followed = t > ot + 1.2; fbtn.textContent = followed ? "Following" : "Follow"; fbtn.style.background = followed ? "#2a2f38" : "#ff2d46";
  const subbed = t > ot + 1.7; sbtn.textContent = subbed ? "Subscribed" : "Subscribe"; sbtn.style.background = subbed ? "#2a2f38" : "#ff2d46";
  fade.style.opacity = clamp((t - (DURATION - 0.45)) / 0.4);
}
window.__renderAt = renderAt;
window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
tl.to({}, { duration: DURATION }, 0);
window.__timelines["main"] = tl;
renderAt(0);
