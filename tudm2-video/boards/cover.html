<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url(../assets/fonts/inter-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:Inter;src:url(../assets/fonts/Inter-700.woff2);font-weight:700}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:#05070b;font-family:Inter}
.bg{position:absolute;inset:0;background:url(../assets/photos/mahkamah-bernama.jpg) 60% 50%/cover;filter:saturate(.85) contrast(1.08)}
.sh{position:absolute;inset:0;background:linear-gradient(rgba(5,7,11,.92),rgba(5,7,11,.55) 38%,rgba(0,0,0,.05) 58%,rgba(0,0,0,.15) 72%,rgba(5,7,11,.85))}
.p2{position:absolute;top:150px;left:0;right:0;text-align:center}.p2 span{display:inline-block;font:700 30px Inter;letter-spacing:6px;color:#fff;background:#ff2d46;padding:10px 22px 8px;border-radius:8px}
.cr{position:absolute;right:30px;bottom:40px;font:700 20px Inter;color:rgba(255,255,255,.75);letter-spacing:1px}
.t{position:absolute;top:250px;left:0;right:0;text-align:center;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.55),0 8px 30px rgba(0,0,0,.8)}
.k{font:800 40px Inter;letter-spacing:2px}
.big{font:800 168px/0.95 Inter;letter-spacing:-6px;margin-top:6px}
.big .r{color:#ff2d46}
.s{font:800 44px Inter;letter-spacing:3px;margin-top:14px}
.ln{width:560px;height:4px;margin:18px auto 0;background:linear-gradient(90deg,transparent,#ff2d46 20%,#ff2d46 80%,transparent)}
.tag{position:absolute;top:1560px;left:0;right:0;text-align:center}
.tag span{display:inline-block;font:800 40px Inter;color:#fff;background:#ff2d46;padding:12px 26px;border-radius:10px;letter-spacing:1px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
</style></head><body>
<div class="bg"></div><div class="sh"></div>
<div class="p2"><span>PART 2</span></div>
<div class="t"><div class="k">KES 96 KG SYABU · PANGKALAN TUDM</div><div class="big"><span class="r">6</span> DIDAKWA</div><div class="s">3 PEGAWAI TUDM · 3 ORANG AWAM</div><div class="ln"></div></div>
<div class="tag"><span>MAHKAMAH: TIADA JAMINAN</span></div>
<div class="cr">Foto: Bernama</div>
</body></html>
