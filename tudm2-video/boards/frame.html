<div class="vig"></div>

<script src="../assets/lib/topojson-client.min.js"></script>
<script type="module">
import { createGlobe, ll } from "../assets/globe.js";
const W = 1080, H = 1920;

const topo = await (await fetch("../assets/geo/countries-10m.json")).json();
const countries = topojson.feature(topo, topo.objects.countries).features;
const byId = (id) => countries.find((c) => +c.id === id);
const CN = byId(156), MY = byId(458), VN = byId(704), PH = byId(608), BN = byId(96), TW = byId(158);

// ---------- overlay layers ----------
const borders = g.layer("borders", 0, { lon0: 92, lon1: 140, lat0: -6, lat1: 34, ppd: 80 });

const lines = g.layer("lines", 3, { lon0: 92, lon1: 140, lat0: -6, lat1: 34, ppd: 80 });
const near = (f) => { const c = f.geometry.coordinates.flat(3); return true; };
{ const L = borders, c = L.ctx; c.strokeStyle = "rgba(255,255,255,.35)"; c.lineWidth = 1; c.lineJoin = "round";
  for (const f of countries) { L.path(f.geometry); c.stroke(); } L.tex.needsUpdate = true; }
function chinaRed() {
  const L = red, c = L.ctx; c.save(); L.path(CN.geometry); c.clip("evenodd");
  c.fillStyle = "rgba(190,18,40,.6)"; c.fillRect(0, 0, L.OW, L.OH);
  c.fillStyle = "rgba(60,0,8,.35)"; for (let y = 0; y < L.OH; y += 6) c.fillRect(0, y, L.OW, 2.5);
  c.restore(); c.strokeStyle = "#ff3d55"; c.lineWidth = 2.5; L.path(CN.geometry); c.stroke(); L.tex.needsUpdate = true;
}
function malaysiaFlag() {
  const L = myl, c = L.ctx; c.save(); L.path(MY.geometry); c.clip("evenodd");
  const x0 = L.ox(99.5), x1 = L.ox(119.4), y0 = L.oy(7.5), y1 = L.oy(0.8), sh = (y1 - y0) / 14;
  for (let i = 0; i < 14; i++) { c.fillStyle = i % 2 ? "rgba(255,255,255,.62)" : "rgba(204,0,1,.7)"; c.fillRect(x0, y0 + i * sh, x1 - x0, sh + 1); }
  c.fillStyle = "rgba(1,0,102,.78)"; c.fillRect(x0, y0, (x1 - x0) * 0.5, sh * 8);

}
// ---------- Negeri Sembilan ----------
const ST = (await (await fetch("../assets/geo/my-states.json")).json()).features;
const N9 = ST.find((f) => f.properties.name === "Negeri Sembilan");
const stl = g.layer("states", 4, { lon0: 99, lon1: 105, lat0: 0.8, lat1: 7, ppd: 300 });
function states(n9fill = true) {
  const L = stl, c = L.ctx; c.lineJoin = "round";
  c.strokeStyle = "rgba(255,255,255,.45)"; c.lineWidth = 1.5; for (const f of ST) { L.path(f.geometry); c.stroke(); }
  if (n9fill) { c.save(); L.path(N9.geometry); c.clip("evenodd"); c.fillStyle = "rgba(255,206,0,.22)"; c.fillRect(0, 0, L.OW, L.OH);

  L.tex.needsUpdate = true;
}
const SEREMBAN = [2.7259, 101.9378];
// timeline strip at the bottom: dates light up as the story moves
const TL = [["2 OGOS", "ANGKAT SUMPAH"], ["16 NOV", "BN: LETAK JAWATAN"], ["17 NOV", "ISTANA: PERLU PERKENAN"], ["20 NOV", "ISTANA: BUKTIKAN MAJORITI"]];
function timeline(on) {
  html(`<div class="tl">${TL.map(([d, s], i) => `<div class="tn ${i < on ? "done" : ""} ${i === on - 1 ? "now" : ""}"><b></b><i>${d}</i><u>${s}</u></div>`).join("")}<div class="tbar"><div style="width:${Math.max(0, (on - 1) / 3) * 100}%"></div></div></div>`);
}
// 36-seat hemicycle
const PARTY = [["BN", 18, "#2f6bff"], ["PH", 11, "#e3262f"], ["PN", 7, "#19a974"]];

  const rows = [8, 12, 16], R0 = 150, dR = 62, pts = [];
  rows.forEach((n, r) => { const R = R0 + r * dR; for (let i = 0; i < n; i++) { const a = Math.PI - (i / (n - 1)) * Math.PI; pts.push({ a, x: 380 + R * Math.cos(a), y: 360 - R * Math.sin(a) }); } });
  pts.sort((p, q2) => q2.a - p.a);
  const col = []; for (const [, n, c] of PARTY) for (let i = 0; i < n; i++) col.push(c);

    <svg width="760" height="380" viewBox="0 0 760 380">${dots}<line x1="380" y1="20" x2="380" y2="372" stroke="#fff" stroke-width="4" stroke-dasharray="10 8"/>
    ${q ? `<text x="380" y="330" text-anchor="middle" font-family="Serif" font-style="italic" font-weight="700" font-size="150" fill="#ff2d46">?</text>` : ""}</svg>
    <div class="maj">MAJORITI <b>19</b> / 36</div>${leg}</div>`);
}
const letter = (x, y, stampTxt) => html(`<div class="letter" style="left:${x}px;top:${y}px"><svg width="260" height="190" viewBox="0 0 260 190"><rect x="4" y="4" width="252" height="182" rx="10" fill="#f4f1ea" stroke="#d9d3c4" stroke-width="3"/><path d="M8 10 L130 100 L252 10" fill="none" stroke="#cfc7b4" stroke-width="5"/>${[0,1,2].map(i=>`<rect x="40" y="${120+i*18}" width="${180-i*40}" height="8" rx="4" fill="#d9d3c4"/>`).join("")}</svg>${stampTxt ? `<div class="stamp" style="left:20px;top:56px;font-size:34px">${stampTxt}</div>` : ""}</div>`);
const nameCard = (x, y, ini, nm, rl, ph) => html(`<div class="ncard" style="left:${x}px;top:${y}px"><div class="ini">${ph ? `<img src="../assets/photos/${ph}">` : ini}</div><div><div class="nm">${nm}</div><div class="rl">${rl}</div></div></div>`);
// ---------- HTML helpers ----------
const ov = document.getElementById("ov");
const FL = {
  MY: '<svg viewBox="0 0 28 14"><g>' + Array.from({ length: 14 }, (_, i) => `<rect y="${i}" width="28" height="1" fill="${i % 2 ? "#fff" : "#cc0001"}"/>`).join("") + '</g><rect width="14" height="8" fill="#010066"/><circle cx="5.5" cy="4" r="2.6" fill="#fc0"/><circle cx="6.3" cy="4" r="2.1" fill="#010066"/><circle cx="10" cy="4" r="1.4" fill="#fc0"/></svg>',
  CN: '<svg viewBox="0 0 30 20"><rect width="30" height="20" fill="#de2910"/><text x="3" y="10" font-size="9" fill="#ffde00">★</text></svg>',
  VN: '<svg viewBox="0 0 30 20"><rect width="30" height="20" fill="#da251d"/><text x="9.5" y="15" font-size="12" fill="#ff0">★</text></svg>',
  PH: '<svg viewBox="0 0 30 20"><rect width="30" height="10" fill="#0038a8"/><rect y="10" width="30" height="10" fill="#ce1126"/><path d="M0 0L14 10L0 20Z" fill="#fff"/><circle cx="5" cy="10" r="2" fill="#fcd116"/></svg>',

// top-down ship silhouette (pointed bow) with a short wake
function shipIcon(L, lo, la, ang, col, sz = 1, wake = true) {
  const c = L.ctx; c.save(); c.translate(L.ox(lo), L.oy(la)); c.rotate(ang); c.scale(sz, sz);
  if (wake) { c.strokeStyle = "rgba(255,255,255,.55)"; c.lineWidth = 2; c.beginPath(); c.moveTo(-14, -4); c.lineTo(-34, -9); c.moveTo(-14, 4); c.lineTo(-34, 9); c.stroke(); }
  c.shadowColor = col; c.shadowBlur = 10; c.fillStyle = col;
  c.beginPath(); c.moveTo(16, 0); c.lineTo(6, -5); c.lineTo(-14, -5); c.lineTo(-14, 5); c.lineTo(6, 5); c.closePath(); c.fill();
  c.shadowBlur = 0; c.fillStyle = "rgba(0,0,0,.45)"; c.fillRect(-6, -2.5, 8, 5); c.restore();
}

  for (let i = 0; i < n; i++) { const a = i / n * 6.283 + .2, lo = 120.9 + r * 1.1 * Math.cos(a), la = 23.7 + r * Math.sin(a);
    if (lo < 119.6 && la > 24.2 && la < 25.6) continue; shipIcon(lines, lo, la, -(a + 1.57), "#ff2d46", 1.6); }
  lines.tex.needsUpdate = true;
}

// approximate drill zone: dashed red box + hatch
function zone(lo0, la0, lo1, la1) {
  const L = lines, c = L.ctx, x = L.ox(lo0), y = L.oy(la1), w = L.ox(lo1) - x, h = L.oy(la0) - y;
  c.save(); c.beginPath(); c.rect(x, y, w, h); c.clip(); c.strokeStyle = "rgba(255,45,70,.35)"; c.lineWidth = 3;
  for (let k = -h; k < w; k += 14) { c.beginPath(); c.moveTo(x + k, y + h); c.lineTo(x + k + h, y); c.stroke(); } c.restore();
  c.setLineDash([12, 8]); c.strokeStyle = "#ff2d46"; c.lineWidth = 4; c.strokeRect(x, y, w, h); c.setLineDash([]); L.tex.needsUpdate = true;
}

// rocket arcs drawn on screen between projected points (lifted bezier), with trail glow + head
function rockets(pairs, prog = 1) {
  let svg = `<svg style="position:absolute;inset:0" width="1080" height="1920"><defs><linearGradient id="rg" x1="0" x2="1"><stop offset="0" stop-color="#ff9a3c" stop-opacity="0"/><stop offset="1" stop-color="#ffe2b0"/></linearGradient><filter id="gw"><feGaussianBlur stdDeviation="4"/></filter></defs>`;
  for (const [a, b, p = prog] of pairs) {
    const A = g.project(a[1], a[0]), B = g.project(b[1], b[0]); const d = Math.hypot(B.x - A.x, B.y - A.y);
    const C = { x: (A.x + B.x) / 2, y: (A.y + B.y) / 2 - d * 0.55 };
    const q = (t) => ({ x: (1 - t) ** 2 * A.x + 2 * (1 - t) * t * C.x + t * t * B.x, y: (1 - t) ** 2 * A.y + 2 * (1 - t) * t * C.y + t * t * B.y });
    const pts = Array.from({ length: 30 }, (_, i) => q(i / 29 * p)); const path = "M" + pts.map((o) => `${o.x.toFixed(1)} ${o.y.toFixed(1)}`).join(" L");
    const h = pts[pts.length - 1];
    svg += `<path d="${path}" stroke="#ff6a2a" stroke-width="10" fill="none" opacity=".55" filter="url(#gw)"/><path d="${path}" stroke="#ffd9a8" stroke-width="3.5" fill="none" stroke-dasharray="2 7" stroke-linecap="round"/>`;
    if (p < 1) svg += `<circle cx="${h.x}" cy="${h.y}" r="14" fill="#ffb347" filter="url(#gw)"/><circle cx="${h.x}" cy="${h.y}" r="6" fill="#fff"/>`;
    svg += `<circle cx="${A.x}" cy="${A.y}" r="16" fill="#ff8a2a" opacity=".8" filter="url(#gw)"/><circle cx="${A.x}" cy="${A.y}" r="5" fill="#fff"/>`;
  }
  html(svg + "</svg>");
}
