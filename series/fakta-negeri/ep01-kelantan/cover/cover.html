<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url(../assets/fonts/inter-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:Inter;src:url(../assets/fonts/inter-latin-700-normal.woff2);font-weight:700}
*{margin:0;box-sizing:border-box}body{width:1080px;height:1920px;overflow:hidden;background:#070b14;font-family:Inter}
.bg{position:absolute;inset:0;background:url(cover-bg.jpg) center/cover;filter:saturate(1.1) contrast(1.05)}
.sh{position:absolute;inset:0;background:linear-gradient(rgba(5,7,12,.92),rgba(5,7,12,.55) 30%,rgba(5,7,12,0) 48%,rgba(5,7,12,0) 70%,rgba(5,7,12,.75) 88%,#05070c)}
.badge{position:absolute;top:120px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:12px 26px;border-radius:40px;background:rgba(10,16,30,.75);border:3px solid rgba(255,90,42,.7);font:800 30px Inter;letter-spacing:5px;color:#f4efe6;white-space:nowrap}
.badge i{width:16px;height:16px;border-radius:50%;background:#ff5a2a;box-shadow:0 0 14px #ff5a2a}
.t{position:absolute;top:240px;left:0;right:0;text-align:center;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.55),0 8px 30px rgba(0,0,0,.85)}
.k{font:800 78px Inter;letter-spacing:2px}
.big{font:800 186px/0.95 Inter;letter-spacing:-5px;color:#ff4a2a;margin-top:4px}
.s{font:800 62px Inter;letter-spacing:1px;margin-top:14px}.s em{font-style:normal;color:#ffd08a}
.tag{position:absolute;top:1560px;left:0;right:0;text-align:center}
.tag span{display:inline-block;font:800 48px Inter;color:#fff;background:#e0452b;padding:16px 30px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.sub{position:absolute;top:1690px;left:0;right:0;text-align:center;font:700 34px Inter;color:#dfe4ee;letter-spacing:3px;text-shadow:0 2px 10px #000}
</style></head><body><div class="bg"></div><div class="sh"></div>
<div class="badge"><i></i>FAKTA NEGERI · #1</div>
<div class="t"><div class="k">JEPUN SERANG</div><div class="big">KELANTAN</div><div class="s">SEBELUM <em>PEARL HARBOR</em>?!</div></div>
<div class="tag"><span>8 DIS 1941 · 1½ JAM LEBIH AWAL</span></div>
<div class="sub">SEJARAH YANG RAMAI TAK TAHU</div>
</body></html>
