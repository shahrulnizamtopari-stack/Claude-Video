  const hookOn = t < T.sebab - 0.1 && t > 0;
  if (ci < 0 || hookOn || t > T.end_vo + 0.6) capEl.style.display = "none";
  else {

    if (capEl.dataset.i != ci) { capEl.innerHTML = ""; capSpans[ci].forEach((s) => capEl.appendChild(s)); capEl.dataset.i = ci; }
    CAPS[ci].w.forEach((w, j) => { const s = capSpans[ci][j]; s.style.color = t >= w.at - 0.03 ? (w.k ? "#ff2d46" : "#fff") : "rgba(255,255,255,.36)"; });
  }

  const hk = win(t, 0.05, T.sebab - 0.35, 0.2, 0.3);

  const [ha, hb, hc, hl] = hook.children;

  const ub = clamp((t - (T.tw1 - 0.05)) / 0.2); hb.style.opacity = ub; hb.style.transform = `scale(${1.45 - 0.45 * eout(ub)})`;
  hc.style.opacity = clamp((t - T.pinang1) / 0.2); hl.style.transform = `scaleX(${eout((t - T.pinang1) / 0.5)})`;

  tint.style.opacity = Math.max(0.7 * win(t, T.tw1, T.tw1 + 0.3, 0.05, 0.5), 0.35 * hit, 0.7 * win(t, T.k100, T.k100 + 0.4, 0.1, 0.8), 0.6 * win(t, T.taksampai, T.taksampai + 0.3, 0.05, 0.6));
