<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url(../assets/fonts/inter-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:Inter;src:url(../assets/fonts/Inter-700.woff2);font-weight:700}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:#05070b;font-family:Inter}
.bg{position:absolute;inset:0;background:url(cover-bg.jpg) center/cover;transform:none}
.sh{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.72),rgba(0,0,0,.25) 34%,rgba(0,0,0,0) 55%,rgba(0,0,0,.45))}
.t{position:absolute;top:230px;left:0;right:0;text-align:center;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.55),0 8px 30px rgba(0,0,0,.8)}
.k{font:800 46px Inter;letter-spacing:3px}
.big{font:800 230px/0.95 Inter;letter-spacing:-6px;margin-top:6px}
.big .r{color:#ff2d46}
.s{font:800 44px Inter;letter-spacing:3px;margin-top:14px}
.ln{width:560px;height:4px;margin:18px auto 0;background:linear-gradient(90deg,transparent,#ff2d46 20%,#ff2d46 80%,transparent)}
.tag{position:absolute;top:1420px;left:0;right:0;text-align:center}
.tag span{display:inline-block;font:800 40px Inter;color:#fff;background:#ff2d46;padding:12px 26px;border-radius:10px;letter-spacing:1px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
</style></head><body>
<div class="bg"></div><div class="sh"></div>
<div class="t"><div class="k">SIAPA SEBENARNYA</div><div class="big"><span class="r">MB</span></div><div class="s">NEGERI SEMBILAN?</div><div class="ln"></div></div>
<div class="tag"><span>ISTANA: BUKTIKAN MAJORITI</span></div>
</body></html>
