const duo = mk(cardWrap, "duo", `<div class="pt"><img src="assets/photos/ismail.jpg"><b>ISMAIL LASIM</b><i>MENGHADAP · PAGI TADI</i></div><div class="arrow">›</div><div class="pt royal"><img src="assets/photos/tuanku.jpg"><b>TUANKU MUHRIZ</b><i>YANG DI-PERTUAN BESAR</i></div>`);
const [ptI, arrowEl, ptT] = duo.children;
const letter = mk(cardWrap, "letter", `<svg width="260" height="190" viewBox="0 0 260 190"><rect x="4" y="4" width="252" height="182" rx="10" fill="#f4f1ea" stroke="#d9d3c4" stroke-width="3"/><path d="M8 10 L130 100 L252 10" fill="none" stroke="#cfc7b4" stroke-width="5"/>${[0, 1, 2].map((i) => `<rect x="40" y="${120 + i * 18}" width="${180 - i * 40}" height="8" rx="4" fill="#d9d3c4"/>`).join("")}</svg><div class="stamp" style="left:14px;top:60px;font-size:32px">BELUM DISAHKAN</div>`);
const stampEl = letter.querySelector(".stamp");

// seats
const PARTY = [["BN", 18, "#2f6bff", "bn", "s18"], ["PH", 11, "#e3262f", "ph", "s11"], ["PN", 7, "#19a974", "pn", "s7"]];
const pts = []; [8, 12, 16].forEach((n, r) => { const R = 150 + r * 62; for (let i = 0; i < n; i++) { const a = Math.PI - (i / (n - 1)) * Math.PI; pts.push({ a, x: 380 + R * Math.cos(a), y: 360 - R * Math.sin(a) }); } });
pts.sort((p, q) => q.a - p.a);
function seatsCard(grey) {
  const e = mk(cardWrap, "seats", `<div class="k">${grey ? "DUN NEGERI SEMBILAN" : "KEPUTUSAN PRN · 1 OGOS 2026"}</div>
    <svg width="760" height="380" viewBox="0 0 760 380">${pts.map((p) => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="21" fill="#252a33" stroke="rgba(0,0,0,.35)" stroke-width="3"/>`).join("")}
    <line class="mj" x1="380" y1="20" x2="380" y2="372" stroke="#fff" stroke-width="4" stroke-dasharray="10 8"/>
    ${grey ? `<text class="q" x="380" y="330" text-anchor="middle" font-family="Serif" font-style="italic" font-weight="700" font-size="150" fill="#ff2d46">?</text>` : ""}</svg>
    <div class="maj">MAJORITI <b>19</b> / <span class="tot">36</span></div>${grey ? "" : `<div class="leg">${PARTY.map(([p, n, c]) => `<span><i style="background:${c}"></i>${p} <b class="pc">0</b></span>`).join("")}</div>`}`);
  e.style.left = "160px"; return e;
}
const S1 = seatsCard(false), S2 = seatsCard(true);
const S1c = [...S1.querySelectorAll("circle")], S2c = [...S2.querySelectorAll("circle")], S1n = [...S1.querySelectorAll(".pc")];

// timeline strip
const TL = [["2 OGOS", "ANGKAT SUMPAH", T.ogos], ["16 NOV", "BN: LETAK JAWATAN", T.isnin], ["17 NOV", "ISTANA: PERLU PERKENAN", T.esok], ["20 NOV", "MENGHADAP · KENYATAAN ISTANA", T.pagi]];
const tlEl = mk(cardWrap, "tl", `${TL.map(([d, s]) => `<div class="tn"><b></b><i>${d}</i><u>${s}</u></div>`).join("")}<div class="tbar"><div></div></div>`);
const tns = [...tlEl.querySelectorAll(".tn")], tbar = tlEl.querySelector(".tbar div");

const capEl = document.getElementById("cap");
const capSpans = CAPS.map((c) => c.w.map((w, i) => { const s = document.createElement("span"); s.textContent = w.t + (i < c.w.length - 1 ? " " : ""); return s; }));
const hook = document.getElementById("hook"), outro = document.getElementById("outro"), fade = document.getElementById("fade"), tint = document.getElementById("tint");
const fbtn = document.getElementById("fbtn"), sbtn = document.getElementById("sbtn");
const fxEl = document.getElementById("fx"); fxEl.style.display = "none";

function show(el, a, b, top, fi = 0.3, fo = 0.25) {
  const k = win(globalT, a, b, fi, fo);
  if (k <= 0) { el.style.display = "none"; return 0; }
  el.style.display = el.classList.contains("duo") || el.classList.contains("tl") || el.classList.contains("ncard") ? "flex" : "block";
  el.style.opacity = k; if (top != null) el.style.top = top + 50 * (1 - eout((globalT - a) / 0.4)) + "px"; return k;
}
let globalT = 0;
function renderAt(t) {
  globalT = t;
  const v = cam(t); g.setView(v);
  g.layers.n9.mesh.material.opacity = clamp((t - T.sembilan1 + 0.3) / 0.4) * (0.85 + 0.15 * Math.sin(t * 3));
  g.layers.states.mesh.material.opacity = clamp((t - 1.0) / 1.0);
  g.render();

  // pins
  for (const p of PINS) {
    const k = win(t, p.a, p.b, 0.25, 0.25);
    if (k <= 0) { p.el.style.display = "none"; continue; }
    const s = g.project(p.ll[0], p.ll[1]);
    p.el.style.display = "flex"; p.el.style.left = s.x + "px"; p.el.style.top = s.y + "px"; p.el.style.opacity = k;
    p.el.style.transform = `translate(-13px,-50%) scale(${0.7 + 0.3 * eout((t - p.a) / 0.25)})`;
  }

  // cards + highlights
  for (const [el, a, b, top] of SCH) show(el, a, b, top);
  for (const [el, a, b] of HL) for (const m of el.querySelectorAll("mark")) m.style.backgroundSize = `${100 * clamp((t - a) / (b - a))}% 100%`;

  // name card
  show(ncard, T.ismail1 - 0.2, T.masa - 0.15, 1120);
  // seats: PRN result fills party by party
  if (show(S1, T.masa - 0.1, T.isnin - 0.15, 800) > 0) {
    let i0 = 0;
    PARTY.forEach(([, n, c, a, z], pi) => { const u = clamp((t - T[a] + 0.1) / Math.max(0.5, T[z] - T[a] + 0.3));
      const k = Math.floor(u * n + 1e-6); for (let i = 0; i < n; i++) S1c[i0 + i].setAttribute("fill", i < k ? c : "#252a33"); S1n[pi].textContent = k; i0 += n; });
  }
  if (show(S2, T.dun2 - 0.1, T.kita + 1.5, 780) > 0) {
    const u = clamp((t - T.dun2) / 1.2); S2c.forEach((c, i) => c.setAttribute("fill", i < Math.floor(u * 36 + 1e-6) ? "#3a404b" : "#1c2027"));
    const mj = clamp((t - T.majoriti2 + 0.1) / 0.3); S2.querySelector(".mj").setAttribute("stroke", mj > 0 ? "#ff2d46" : "#fff");
    S2c.forEach((c, i) => { if (i < 19 && t > T.s19) c.setAttribute("stroke", "rgba(255,45,70,.9)"); else c.setAttribute("stroke", "rgba(0,0,0,.35)"); });
    const q = S2.querySelector(".q"), uq = clamp((t - T.tapi2) / 0.25); q.style.opacity = uq;
    q.setAttribute("transform", `translate(380 290) scale(${1.6 - 0.6 * eout(uq) + 0.05 * Math.sin(t * 4) * uq}) translate(-380 -290)`);
  }
  // letter flies to the palace pin, then gets the stamp
  { const k = win(t, T.surat1 - 0.3, T.pagi - 0.1, 0.2, 0.3);
    letter.style.display = k > 0 ? "block" : "none";
    if (k > 0) { const s = g.project(2.70, 101.95), u = eout((t - T.surat1 + 0.3) / 0.7);
      const x = -320 + (s.x + 40 - -320) * u, y = s.y - 330 + 140 * (1 - u) * Math.sin(u * Math.PI);
      letter.style.left = x + "px"; letter.style.top = y + "px"; letter.style.opacity = k; letter.style.transform = `rotate(${-4 - 20 * (1 - u)}deg)`;
      const us = clamp((t - T.disahkan) / 0.22); stampEl.style.display = t >= T.disahkan ? "block" : "none"; stampEl.style.opacity = us;
      stampEl.style.transform = `rotate(-8deg) scale(${1.7 - 0.7 * eout(us)})`; } }
  // audience: Ismail, then Tuanku (official portrait, no effects)
  if (show(duo, T.menghadap - 0.4, T.tapi - 0.1, null) > 0) {
    duo.style.top = "560px";
    ptI.style.opacity = clamp((t - T.menghadap + 0.4) / 0.3); ptI.style.transform = `translateY(${30 * (1 - eout((t - T.menghadap + 0.4) / 0.4))}px)`;
    arrowEl.style.opacity = 0.7 * clamp((t - T.menghadap) / 0.3);
    ptT.style.opacity = clamp((t - T.menghadap - 0.2) / 0.4); ptT.style.transform = `translateY(${30 * (1 - eout((t - T.menghadap - 0.2) / 0.5))}px)`;
  }
  // timeline
  if (show(tlEl, T.ogos - 0.2, T.end_vo + 0.3, null) > 0) {
    let on = 0; TL.forEach(([, , a], i) => { if (t >= a) on = i + 1; });
    tns.forEach((n, i) => { n.classList.toggle("done", i < on); n.classList.toggle("now", i === on - 1);
      const pop = clamp((t - TL[i][2]) / 0.3); n.querySelector("b").style.transform = `scale(${i === on - 1 ? 1 + 0.4 * (1 - pop) : 1})`; });
    const prev = on > 1 ? TL[on - 1][2] : 0; tbar.style.width = Math.max(0, (on - 2 + eout((t - prev) / 0.6)) / 3) * 100 + "%";
  }

  // captions
  let ci = -1; for (let i = 0; i < CAPS.length; i++) if (t >= CAPS[i].a && t < CAPS[i].b) ci = i;
  const hookOn = t < T.ni - 0.1;
  if (ci < 0 || hookOn || t > T.end_vo + 0.6) capEl.style.display = "none";
  else {
    capEl.style.display = "block";
    if (capEl.dataset.i != ci) { capEl.innerHTML = ""; capSpans[ci].forEach((s) => capEl.appendChild(s)); capEl.dataset.i = ci; }
    CAPS[ci].w.forEach((w, j) => { const s = capSpans[ci][j]; s.style.color = t >= w.at - 0.03 ? (w.k ? "#ff2d46" : "#fff") : "rgba(255,255,255,.36)"; });
  }

  // hook
  const hk = win(t, 0.05, T.ni - 0.3, 0.2, 0.3);
  hook.style.display = hk > 0 ? "block" : "none"; hook.style.opacity = hk;
  const [ha, hb, hc, hl] = hook.children;
  ha.style.opacity = clamp((t - 0.1) / 0.25); ha.style.transform = `translateY(${20 * (1 - eout((t - 0.1) / 0.3))}px)`;
  const ub = clamp((t - 0.62) / 0.2); hb.style.opacity = ub; hb.style.transform = `scale(${1.45 - 0.45 * eout(ub)})`;
  hc.style.opacity = clamp((t - T.sembilan1 + 0.25) / 0.2); hl.style.transform = `scaleX(${eout((t - T.sembilan1) / 0.5)})`;

  tint.style.opacity = Math.max(0.6 * win(t, 0.62, 0.9, 0.05, 0.5), 0.6 * win(t, T.disahkan, T.disahkan + 0.25, 0.05, 0.5), 0.7 * win(t, T.kekal, T.kekal + 0.4, 0.1, 0.8), 0.5 * win(t, T.tapi2, T.tapi2 + 0.3, 0.05, 0.6));

  // outro
  const ot = T.end_vo + 0.4, ok = win(t, ot, DURATION + 1, 0.4, 0.1);
  outro.style.display = ok > 0 ? "block" : "none"; outro.style.opacity = ok;
  outro.firstElementChild.style.transform = `translateY(${40 * (1 - eout((t - ot) / 0.5))}px)`;
  const followed = t > ot + 1.2; fbtn.textContent = followed ? "Following" : "Follow"; fbtn.style.background = followed ? "#2a2f38" : "#ff2d46";
  const subbed = t > ot + 1.7; sbtn.textContent = subbed ? "Subscribed" : "Subscribe"; sbtn.style.background = subbed ? "#2a2f38" : "#ff2d46";
  fade.style.opacity = clamp((t - (DURATION - 0.45)) / 0.4);
}
window.__renderAt = renderAt;
window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
tl.to({}, { duration: DURATION }, 0);
window.__timelines["main"] = tl;
renderAt(0);
resolveWorld();
</script>
