    <script type="module">
      import { createWorld } from "./assets/world.js";
      import { warp } from "./assets/timing.js";
      const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
      const scale = Number(vars.previewScale) || 1;
      await Promise.all(["500", "600", "700", "800"].map((w) => document.fonts.load(`${w} 40px "Inter"`)));
      let fxOpts = {}; try { fxOpts = vars.fx ? JSON.parse(vars.fx) : {}; } catch (e) {}
      const world = createWorld(document.getElementById("world-canvas"), 1080, 1920, scale, fxOpts);
      const T = world.T;

      const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
      const ss = (e0, e1, x) => { const u = clamp((x - e0) / (e1 - e0)); return u * u * (3 - 2 * u); };
      const win = (t, t0, t1, fin = 0.3, fout = 0.3) => (t0 <= 0 ? 1 : ss(t0, t0 + fin, t)) * (t1 >= 60 ? 1 : 1 - ss(t1 - fout, t1, t));

      const HOOK = "Bom <em>bawah kaki kau</em>";
      const CH = [
        [0, 7, HOOK], [7, 14, "Kerak <em>lebih nipis</em> dari kulit epal"], [14, 21, "Magma <em>naik</em>, berkumpul"], [21, 33, "Rahsia letupan: <em>gas</em>"],
        [33, 40, "Cair <em>mengalir</em>, pekat <em>meletup</em>"], [40, 50, "Krakatau, <em>1883</em>"], [50, 58.8, "Pemusnah, <em>pemberi makan</em>"], [58.8, 60, HOOK],
      ];
      const NOTES = [[7.2, 14, "Kerak Bumi 5–70 km tebal · jejari Bumi 6371 km"], [21.2, 33, "Gas terlarut (wap air, CO₂) keluar bila tekanan turun"], [40.2, 50, "Kedengaran di Pulau Rodrigues, ~4800 km dari Krakatau"]];
      const LABELS = [
        ["crater", "KAWAH", 1.2, 6.8, 1],
        ["skin", "KULIT EPAL", 8.3, 13.6, 1], ["crust", "KERAK BUMI", 9.0, 13.6, -1], ["mantle", "MANTEL", 11.9, 13.6, -1],
        ["chamber", "KEBUK MAGMA", 19.4, 22.4, 1], ["conduit", "SALURAN", 27.6, 31.2, 1], ["bubble", "GELEMBUNG GAS", 29.4, 32.3, 1], ["soda", "SODA = MAGMA", 25.2, 26.9, 1],
        ["runny", "LAVA CAIR · HAWAII", 34.0, 36.7, 1], ["dome", "MAGMA PEKAT", 37.3, 39.4, 1],
        ["kra", "KRAKATAU", 41.6, 49.6, 1], ["rod", "PULAU RODRIGUES", 46.2, 49.6, -1], ["field", "TANAH SUBUR", 54.0, 57.8, 1],
      ];
      const $ = (s) => document.querySelector(s);
      const titleEl = $("#title"), noteEl = $("#note"), labelsEl = $("#labels"), cta = $("#cta"), rew = $("#rew");
      const lblEls = LABELS.map(() => { const d = document.createElement("div"); d.className = "lbl"; d.innerHTML = '<span class="ln"></span><span class="pt"></span><span class="tx"></span>'; labelsEl.appendChild(d); return d; });
      const fmt0 = (v) => Math.round(v).toLocaleString("en-US").replace(/,/g, " ");
      function overlay(o, t) {
        const ch = CH.find(([a, b]) => t >= a && t < b) || CH[CH.length - 1];
        const ta = win(t, ch[0], ch[1], 0.35, 0.3);
        if (titleEl.innerHTML !== ch[2]) titleEl.innerHTML = ch[2];
        titleEl.style.opacity = ta; titleEl.style.filter = `blur(${(1 - ta) * 10}px)`; titleEl.style.transform = `scale(${0.96 + 0.04 * ta})`;
        // HUD: magma temperature in the hook (and loop), sound distance for Krakatau
        const hm = $("#hud-main"); hm.style.left = "540px"; hm.style.top = "300px";
        let a = 0, lab = "Magma", val = "1200", unit = "°C", c = "#ff5a1a";
        if (t < 7.2) { a = 1 - ss(6.9, 7.2, t); val = fmt0(lerp2(900, 1200, ss(0, 5.0, t)) + 8 * Math.sin(t * 9)); }
        else if (t > 43.6 && t < 49.8) { a = ss(43.6, 44.0, t) * (1 - ss(49.4, 49.8, t)); lab = "Bunyi sampai"; c = "#ffb020"; val = fmt0(4800 * ss(44.2, 46.7, t)); unit = "km"; }
        else if (t > 59.0) { a = ss(59.0, 59.6, t); val = "900"; }
        hm.style.opacity = a; hm.querySelector(".dot").style.background = c; hm.querySelector(".sl").textContent = lab; hm.querySelector(".sl").style.color = c;
        hm.querySelector(".val").textContent = val; hm.querySelector(".unit").textContent = unit;
        $("#hud-a").style.opacity = 0; $("#hud-b").style.opacity = 0;
        LABELS.forEach(([k, txt, t0, t1, side], i) => {
          const el = lblEls[i], p = o.anchors[k]; const la = p && p[2] ? win(t, t0, t1, 0.25, 0.25) : 0;
          el.style.opacity = la; if (la <= 0) return;
          el.style.left = p[0] + "px"; el.style.top = p[1] + "px";
          const L = 110 * ss(t0, t0 + 0.35, t);
          const ln = el.querySelector(".ln"), tx = el.querySelector(".tx");
          ln.style.width = L + "px"; ln.style.left = side > 0 ? "0px" : -L + "px";
          if (tx.textContent !== txt) tx.textContent = txt;
          tx.style.left = side > 0 ? L + "px" : "auto"; tx.style.right = side > 0 ? "auto" : L + "px";
        });
        const n = NOTES.find(([a, b]) => t >= a && t < b);
        noteEl.style.opacity = n ? win(t, n[0], n[1]) : 0; if (n && noteEl.textContent !== n[2]) noteEl.textContent = n[2];
        cta.style.opacity = 0; rew.style.opacity = 0;
