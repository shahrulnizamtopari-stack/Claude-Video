<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Anton;src:url(fonts/Anton.woff2)}
@font-face{font-family:DMSerif;src:url(fonts/DMSerifDisplay.woff2)}
@font-face{font-family:Marker;src:url(fonts/PermanentMarker.woff2)}
@font-face{font-family:Typewriter;src:url(fonts/SpecialElite.woff2)}
@font-face{font-family:Narrow;font-weight:700;src:url(fonts/ArchivoNarrow.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#ece4d6}
#f{position:relative;width:1080px;height:1920px;background:#ece4d6;color:#1d1b18;overflow:hidden}
#f>*{position:absolute}
.grain{inset:0;width:1080px;height:1920px;mix-blend-mode:multiply;pointer-events:none}
.tape{width:220px;height:62px;background:rgba(236,222,170,.8);box-shadow:0 2px 4px rgba(0,0,0,.12)}
.riso{position:relative;display:inline-block}.riso .g{position:absolute;left:9px;top:7px;color:#2e56b8;opacity:.5;mix-blend-mode:multiply}.riso .m{position:relative}
.dymo{display:inline-block;background:#141414;color:#f4f4f4;font:700 54px Narrow;letter-spacing:7px;padding:16px 28px 13px;border-radius:7px;box-shadow:0 4px 7px rgba(0,0,0,.3);white-space:nowrap}
.stamp{display:inline-block;font:400 70px Anton;letter-spacing:5px;border:10px solid currentColor;border-radius:14px;padding:6px 26px;mix-blend-mode:multiply;opacity:.92;white-space:nowrap}
</style></head><body>
<div id="f">
 <svg width="0" height="0" style="position:absolute"><defs>
  <filter id="n" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .4  0 0 0 0 .34  0 0 0 .5 0"/></filter>
  <filter id="b" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".006" numOctaves="3" seed="9"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .42  0 0 0 0 .3  0 0 0 .45 -.08"/></filter></defs></svg>
 <svg class="grain"><rect width="1080" height="1920" filter="url(#b)"/></svg>
 <div style="left:80px;top:250px;font:38px Typewriter;letter-spacing:5px">SENAT AMERIKA · 1789 → 2026</div>
 <div style="left:60px;top:290px;font:400 330px/0.9 Anton;color:#d23820"><span class="riso"><span class="g">237</span><span class="m">237</span></span></div>
 <div style="left:80px;top:590px;font:400 110px/0.92 Anton">TAHUN.</div>
 <div style="left:580px;top:380px;width:440px;height:560px;transform:rotate(3deg);box-shadow:5px 8px 0 rgba(0,0,0,.12),0 20px 40px rgba(0,0,0,.2);overflow:hidden"><img src="riso-houston-6.png" style="width:100%;height:100%;object-fit:cover;object-position:35% 20%"></div>
 <div class="tape" style="left:690px;top:355px;transform:rotate(-4deg)"></div>
 <div style="left:80px;top:1030px;width:920px;font:84px/1.02 DMSerif">Muslim <span style="background:linear-gradient(transparent 55%,#f6dc3c 55%)">pertama</span> dipilih ke Senat Amerika.</div>
 <div style="left:80px;top:1300px;transform:rotate(-2deg)"><span class="dymo">ABDUL EL-SAYED</span></div>
 <div style="left:650px;top:1280px;transform:rotate(-7deg);color:#2e56b8"><span class="stamp">MENANG</span></div>
 <div style="left:80px;top:1460px;font:26px Typewriter;color:#444">Foto: Conlan Houston / CC BY-SA 4.0 (diubah)</div>
 <svg class="grain" style="opacity:.6"><rect width="1080" height="1920" filter="url(#n)"/></svg>
</div>
</body></html>
