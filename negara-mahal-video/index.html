const place = (el, lat, lon, dy = 0) => { const p = g.project(lat, lon); if (!p.visible) { el.style.display = "none"; return null; } el.style.left = p.x + "px"; el.style.top = p.y + dy + "px"; return p; };

function renderAt(t) {
  g.setView(cam(t));
  const tEnd = T.ini - 0.3;
  FL.us.mesh.material.opacity = win(t, T.amerika - 0.1, tEnd, 0.3, 0.4) * 0.95;

  myl.mesh.material.opacity = Math.max(win(t, T.my1 - 0.2, T.n2 - 0.1, 0.35, 0.3), win(t, T.my2, DURATION + 1, 0.4, 0.1));
  if (t >= T.my2) FL.sg.mesh.material.opacity = win(t, T.my2 + 0.3, DURATION + 1, 0.4, 0.1) * 0.95;
  g.render();

  // hook A: receipt unrolls, tags pop, then it tears away
  const rA = 1.9;
  if (t < rA + 0.5) {
    rcpt.style.display = "block"; const up = eout((t - rA) / 0.35);
    rcpt.style.transform = `rotate(-4deg) translateY(${-1150 * (1 - eout(t / 1.1)) - 1500 * up}px)`; rcpt.style.opacity = 1;
    TAGS.forEach((g2, i) => { const u = clamp((t - 0.25 - i * 0.18) / 0.2); g2.e.style.display = u > 0 && up < 1 ? "block" : "none";
      g2.e.style.opacity = u * (1 - up); g2.e.style.transform = `rotate(${g2.r}deg) scale(${pop(u) * (0.4 + 0.6 * eout(u))}) translateY(${-900 * up}px)`; });
  } else { rcpt.style.display = "none"; TAGS.forEach((g2) => (g2.e.style.display = "none")); }
  dim.style.opacity = 0.72 * (1 - eout((t - rA) / 0.45));
  // hook B: SALAH stamps on the US and Japan
  [[xUS, 40, -100, 190, 890], [xJP, 37, 139, 190, 890]].forEach(([el, la, lo, x0, x1]) => {
    const k = show(el, t, T.salah - 0.02, tEnd, "block", 0.06, 0.3); if (!k) return;
    const p = g.project(la, lo); el.style.left = clamp(p.x, x0, x1) + "px"; el.style.top = p.y + "px";
    const u = clamp((t - T.salah) / 0.18); el.style.transform = `translate(-50%,-50%) rotate(-10deg) scale(${1.8 - 0.8 * eout(u)})`; });
  if (show(hk2, t, T.salah + 0.25, tEnd)) {
    const u = clamp((t - T.salah - 0.25) / 0.2); hkB.style.transform = `scale(${1.4 - 0.4 * eout(u)})`;
    hkC.style.opacity = clamp((t - T.salah - 0.5) / 0.25); hkL.style.transform = `scaleX(${eout((t - T.salah - 0.5) / 0.5)})`;
    hkD.style.opacity = clamp((t - T.dan1 + 0.1) / 0.3);

  // title card
  if (show(tt, t, T.ini - 0.2, T.n5 - 0.35)) {
    const u = clamp((t - T.ini + 0.2) / 0.25); tt5.style.transform = `scale(${1.5 - 0.5 * eout(u)})`;
    tt1.style.opacity = clamp((t - T.ini - 0.3) / 0.3); ttc.style.opacity = clamp((t - T.termasuk + 0.1) / 0.25);

  for (const s of SC) {

    const x = t - s.a - (s.gold ? 0.35 : 0.15);

    s.rk.style.transform = `translateY(${50 * (1 - eout(x / 0.4))}px) scale(${s.gold ? pop(clamp(x / 0.45)) : 1})`;
    const u = eout((t - s.a - 0.3) / Math.max(0.6, s.vt - s.a)); s.num.textContent = (s.v * u).toFixed(1);
    const c = clamp((t - s.ct) / 0.3);
    if (c > 0) { s.cmp.style.display = "block"; s.cmp.style.opacity = c * k; s.cmp.style.transform = `translateY(${40 * (1 - eout(c))}px)`;
      const nyFirst = s.rows[s.rows.length - 1][0] === "ny";
      s.bars.forEach((b, i) => { const order = nyFirst ? (i === s.rows.length - 1 ? 0 : 1) : i;

  // re-hook
