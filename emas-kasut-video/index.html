  for (const [a, amt, hold] of ZP) { const x = t - a + 0.08; if (x < 0 || x > hold + 1.6) continue;
    m += amt * ease(clamp(x / 0.3)) * (1 - ease(clamp((x - 0.3 - hold) / 1.3))); }
  return (1 + m) * (1 - 0.03 * Math.sin(t * 0.9));
}
function cam(t) {
  let i = 0; while (i < K.length - 2 && t > K[i + 1][0]) i++;
  const A = K[i], B = K[i + 1], u = ease(clamp((t - A[0]) / (B[0] - A[0])));
  const L = (k) => A[k] + (B[k] - A[k]) * u;
  const d = Math.exp(Math.log(A[3]) + (Math.log(B[3]) - Math.log(A[3])) * u);
  return { lat: L(1), lon: L(2), dist: d * zoomMod(t), tilt: L(4), yShift: L(5) };
}

const pinWrap = document.getElementById("pins"), cardWrap = document.getElementById("cards");
const mk = (parent, cls, html) => { const e = document.createElement("div"); e.className = "el " + cls; e.innerHTML = html; parent.appendChild(e); return e; };
const loc = (txt, sub, red) => `<div class="dot ${red ? "red" : ""}"></div><div style="display:flex;flex-direction:column;align-items:flex-start;gap:6px"><div class="lab">${txt}</div>${sub ? `<div class="sub ${red ? "red" : ""}">${sub}</div>` : ""}</div>`;
const PINS = [
  { ll: BIM, txt: "PADANG", sub: "", red: 1, a: 0.9, b: T.ni - 0.3 },
  { ll: BIM, txt: "BIA MINANGKABAU", sub: "PADANG · 12 NOV", red: 1, a: T.minang - 0.2, b: T.naik },
  { ll: BIM, txt: "BIA MINANGKABAU", sub: "PELEPASAN", red: 1, a: T.naik, b: T.pelepasan + 0.2 },
  { ll: MYS, txt: "MALAYSIA", sub: "DESTINASI", a: T.malaysia3 - 0.3, b: T.pelepasan + 0.2 },
  { ll: BIM, txt: "BIA MINANGKABAU", sub: "DITAHAN · SIASATAN", red: 1, a: T.lelaki3, b: T.k2 - 0.1 },
].map((p) => ({ ...p, el: mk(pinWrap, "pin lpin", loc(p.txt, p.sub, p.red)) }));
const plane = mk(pinWrap, "plane", "✈");

const card = (outlet, date, head, foot) => mk(cardWrap, "card", `<div class="hd"><b>${outlet}</b><i>${date}</i></div><div class="bd">${head}<div class="ft">${foot}</div></div>`);
const C = {
  bh: card("BERITA HARIAN", "21 NOV 2026", `Lelaki Malaysia ditahan di lapangan terbang Indonesia, <mark>cuba seludup 4kg emas</mark>`, "Tajuk asal · bharian.com.my"),
  tv1: card("TVONE NEWS", "21 NOV 2026", `WNA Malaysia pembawa 4 kg emas di sepatu <mark>berstatus kurir</mark>, asal barang ditelusuri`, "Tajuk asal · tvonenews.com"),
};
const SCH = [[C.bh, T.lapangan - 0.2, T.seorang - 0.1, 1100], [C.tv1, T.media - 0.1, T.lelaki3 - 0.1, 1100]];
const HL = [[C.bh, T.minang, T.minang + 0.9], [C.tv1, T.kurier - 0.4, T.kurier + 0.5]];

const person = mk(cardWrap, "ncard", `<div class="ini"><svg width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="44" r="22" fill="#9aa3ad"/><path d="M18 120 Q18 74 60 74 Q102 74 102 120Z" fill="#9aa3ad"/></svg></div><div><div class="nm">LELAKI MALAYSIA</div><div class="rl">34 TAHUN · NAK TERBANG KE MALAYSIA</div></div>`);
person.style.left = "160px";
const stampEl = mk(cardWrap, "stamp", "DITAHAN"); stampEl.style.fontSize = "64px";

let gid = 0;
const shoeSvg = (xray = true) => { const id = "gold" + gid++;
  const shoe = (x, flip) => `<g transform="translate(${x} 0) ${flip ? "scale(-1 1) translate(-150 0)" : ""}"><path d="M75 10 C120 10 135 60 132 120 C128 200 120 260 110 300 C100 335 50 335 40 300 C28 255 20 200 18 120 C15 60 30 10 75 10Z" fill="${xray ? "rgba(90,190,255,.12)" : "#3b2a20"}" stroke="${xray ? "#7fdcff" : "#6b4a35"}" stroke-width="5"/>
    <rect class="gb" x="44" y="95" width="62" height="88" rx="6" fill="url(#${id})" stroke="#fff3b0" stroke-width="3"/><rect class="gb" x="44" y="195" width="62" height="88" rx="6" fill="url(#${id})" stroke="#fff3b0" stroke-width="3"/></g>`;
  return `<svg width="420" height="350" viewBox="0 0 330 350"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1a8"/><stop offset=".45" stop-color="#f2b632"/><stop offset="1" stop-color="#a9741a"/></linearGradient></defs>${shoe(5, false)}${shoe(175, true)}</svg>`;
};
const XR = mk(cardWrap, "xr", `<div class="k">IMBASAN · 2 BATANG SETIAP KASUT</div>${shoeSvg()}<div class="bigq">?</div><div class="scan" style="position:absolute;top:50px;width:760px;height:8px;left:0;background:#7fdcff;box-shadow:0 0 30px 10px rgba(127,220,255,.6)"></div>`);
const xrK = XR.querySelector(".k"), xrQ = XR.querySelector(".bigq"), xrScan = XR.querySelector(".scan"), xrBars = [...XR.querySelectorAll(".gb")];
const statE = mk(cardWrap, "stat", `<div class="k">UJIAN MAKMAL</div><div><div class="n"><span class="v">0</span></div></div><div class="u">EMAS TULEN · ≈ 4 KG</div><div class="bar"><div></div></div>`);
const statV = mk(cardWrap, "stat", `<div class="k">NILAI ANGGARAN</div><div class="n" style="font-size:104px;margin:6px 0 0;white-space:nowrap"><span class="v">Rp10 BILION</span></div><div class="u" style="font-size:28px;color:#9aa3ad"><s class="o"></s></div>`);
statV.style.padding = "20px 40px 22px";
const statJ = mk(cardWrap, "stat", `<div class="k">STATUS</div><div class="n" style="font-size:130px">20 HARI</div><div class="u">DITAHAN UNTUK SIASATAN</div><div class="jail"><span>HUKUMAN JIKA SABIT</span><div class="rng"><b></b></div><span class="lb">1 TAHUN</span><span class="lb r">10 TAHUN</span></div>`);
const jailB = statJ.querySelector(".rng b");
const END = mk(cardWrap, "xr", `<div style="display:flex;align-items:center;gap:20px;justify-content:center">${shoeSvg(false)}<div class="bars"><div></div><div></div><div></div><div></div><div></div><b>10 TAHUN</b></div></div>`);
END.style.background = "none"; END.style.boxShadow = "none";
const endBars = END.querySelector(".bars");
const bubs = mk(cardWrap, "bubs", `<span>RM10K?</span><span>RM50K?</span><span>RM100K?</span><span class="r">TAK BERBALOI 🙅</span>`);
const bubEls = [...bubs.children];
const komen = mk(cardWrap, "komen", "KOMEN ↓");

const capEl = document.getElementById("cap");
const capSpans = CAPS.map((c) => c.w.map((w, i) => { const s = document.createElement("span"); s.textContent = w.t + (i < c.w.length - 1 ? " " : ""); return s; }));
const hook = document.getElementById("hook"), outro = document.getElementById("outro"), fade = document.getElementById("fade"), tint = document.getElementById("tint");
const fbtn = document.getElementById("fbtn"), sbtn = document.getElementById("sbtn");
document.getElementById("fx").style.display = "none";

// framed AI stills with a slow push (Ken Burns); gold gets a light sweep
const BR = [{ k: "shoes", a: T.jumpa - 0.4, b: T.ujian - 0.1, z: [1.0, 1.12], x: [0, -20] }, { k: "gold", a: T.nilai - 0.2, b: T.media - 0.2, z: [1.05, 1.18], x: [10, -25] }]
  .map((c) => ({ ...c, w: document.getElementById("bw-" + c.k) }));
const brollEl = document.getElementById("broll"), vigEl = document.querySelector(".vig"), shine = document.getElementById("shine");
function brollAt(t) {
  let on = 0;
  for (const c of BR) { const k = win(t, c.a, c.b - 0.2, 0.2, 0.2); on = Math.max(on, k); const u = clamp((t - c.a) / (c.b - c.a));
    c.w.style.opacity = k > 0 ? 1 : 0; c.w.style.transform = `translateX(${c.x[0] + (c.x[1] - c.x[0]) * u}px) scale(${c.z[0] + (c.z[1] - c.z[0]) * u})`; }
  const su = ((t - BR[1].a) % 1.8) / 1.8; shine.style.transform = `translateX(${-120 + 240 * su}%)`;
  brollEl.style.opacity = on; brollEl.style.transform = `scale(${0.86 + 0.14 * eout(on)})`;
  vigEl.style.opacity = 1 - on * 0.3; pinWrap.style.opacity = 1 - on;
}
const show = (el, t, a, b, top, disp = "block") => {
  const k = win(t, a, b, 0.3, 0.25);
  if (k <= 0) { el.style.display = "none"; return 0; }
  el.style.display = disp; el.style.opacity = k; if (top != null) el.style.top = top + 50 * (1 - eout((t - a) / 0.4)) + "px"; return k;
};

function renderAt(t) {
  brollAt(t);
  const v = cam(t); g.setView(v);
  // flight line
  const fOn = win(t, T.naik - 0.2, T.pelepasan + 1.5, 0.3, 0.6);
  const prog = t < T.pelepasan ? STOP * eout((t - T.naik + 0.1) / (T.malaysia3 - T.naik + 0.6)) : STOP;
  const stopped = t >= T.pelepasan;
  for (const r of [fw, fg]) { r.u.op.value = fOn; r.u.prog.value = prog; r.u.col.value.set(stopped ? 0xff2d46 : r === fw ? 0xdff8ff : 0x7fdcff); }
  fw.u.off.value = -t * 1.5;
  g.render();

  for (const p of PINS) {
    const k = win(t, p.a, p.b, 0.25, 0.25);
    if (k <= 0) { p.el.style.display = "none"; continue; }
    const s = g.project(p.ll[0], p.ll[1]);
    p.el.style.display = "flex"; p.el.style.left = s.x + "px"; p.el.style.top = s.y + "px"; p.el.style.opacity = k;
    p.el.style.transform = `translate(-13px,-50%) scale(${(0.7 + 0.3 * eout((t - p.a) / 0.25)) * (p.red ? 1 + 0.05 * Math.sin(t * 6) : 1)})`;
  }
  // plane icon at the head of the line
  if (fOn > 0 && t < T.pelepasan + 1.2) {
    const f = prog * (ROUTE.length - 1), i = Math.min(ROUTE.length - 2, Math.floor(f)), k = f - i;
    const lo = ROUTE[i][0] + (ROUTE[i + 1][0] - ROUTE[i][0]) * k, la = ROUTE[i][1] + (ROUTE[i + 1][1] - ROUTE[i][1]) * k;
    const s = g.project(la, lo), s2 = g.project(ROUTE[i + 1][1], ROUTE[i + 1][0]);
    plane.style.display = "block"; plane.style.left = s.x - 27 + "px"; plane.style.top = s.y - 32 + "px"; plane.style.opacity = fOn;
    plane.style.color = stopped ? "#ff2d46" : "#fff";
    plane.style.transform = `rotate(${Math.atan2(s2.y - s.y, s2.x - s.x) * 57.3}deg) scale(${stopped ? 1 + 0.1 * Math.sin(t * 10) : 1})`;
  } else plane.style.display = "none";

  for (const [el, a, b, top] of SCH) show(el, t, a, b, top);
  for (const [el, a, b] of HL) for (const m of el.querySelectorAll("mark")) m.style.backgroundSize = `${100 * clamp((t - a) / (b - a))}% 100%`;
  show(person, t, T.seorang - 0.1, T.tapi - 0.1, 1100, "flex");
  { const on = win(t, T.pelepasan + 0.2, T.ujian - 0.2, 0.05, 0.3), u = clamp((t - T.pelepasan - 0.2) / 0.22);
    stampEl.style.display = on > 0 ? "block" : "none"; stampEl.style.left = "330px"; stampEl.style.top = "1170px"; stampEl.style.opacity = on;
    stampEl.style.transform = `rotate(-8deg) scale(${1.7 - 0.7 * eout(u)})`; }

  // x-ray shoes: scan, bars glow; later the "?" for "milik siapa"
  const xrOn = Math.max(win(t, T.ujian - 0.1, T.nilai - 0.3, 0.3, 0.25), win(t, T.media - 0.1, T.lelaki3 - 0.1, 0.3, 0.25));
  if (xrOn > 0) {
    XR.style.display = "block"; XR.style.opacity = xrOn; XR.style.top = (t < T.nilai ? 420 : 330) + "px";
    const su = clamp((t - T.ujian) / 0.9); xrScan.style.display = su > 0 && su < 1 ? "block" : "none"; xrScan.style.top = 50 + su * 330 + "px";
    xrBars.forEach((b, i) => { const lit = t > T.ujian + 0.9 * ((i % 2 ? 195 : 95) / 330); b.style.opacity = lit ? 0.85 + 0.15 * Math.sin(t * 6 + i) : 0.08; });
    xrK.textContent = t < T.nilai ? "IMBASAN · 2 BATANG SETIAP KASUT" : "MILIK SIAPA?";
    const uq = clamp((t - T.siapa + 0.3) / 0.25); xrQ.style.display = t >= T.media ? "block" : "none"; xrQ.style.opacity = uq; xrQ.style.transform = `scale(${1.6 - 0.6 * eout(uq)})`;
  } else XR.style.display = "none";
  if (show(statE, t, T.ujian + 0.2, T.nilai - 0.3, 1000) > 0) {
    const u = eout((t - T.p99 + 0.2) / 0.7); statE.querySelector(".v").textContent = (u > 0.99 ? ">" : "") + Math.round(99 * u) + "%";
    statE.querySelector(".bar div").style.width = 99 * u + "%";
  }
  if (show(statV, t, T.bilion - 0.4, T.media - 0.2, 1110) > 0) {
    const rm = t >= T.juta - 0.1; statV.querySelector(".v").textContent = rm ? "RM2.25 JUTA" : "Rp10 BILION";
    statV.querySelector(".o").textContent = rm ? "Rp10 BILION" : ""; const u = clamp((t - T.juta + 0.1) / 0.2);
    statV.querySelector(".n").style.transform = `scale(${rm ? 1.3 - 0.3 * eout(u) : 1})`;
  }
  if (show(statJ, t, T.lelaki3 - 0.1, T.k2 - 0.1, 880) > 0) {
    jailB.style.width = 90 * eout((t - T.sabit) / (T.t10 - T.sabit + 0.3)) + "%"; jailB.style.left = "10%";
  }
  // engagement ending
  if (show(END, t, T.k2 - 0.1, T.end_vo + 0.4, 330) > 0) { const u = clamp((t - T.risiko + 0.2) / 0.3); endBars.style.opacity = u; endBars.style.transform = `translateY(${-60 * (1 - eout(u))}px)`; }
  if (show(bubs, t, T.korang, T.end_vo + 0.4, null, "flex") > 0) {
    bubs.style.top = "800px";
    bubEls.forEach((b, i) => { const u = clamp((t - T.korang - 0.2 - i * 0.45) / 0.25); b.style.opacity = u; b.style.transform = `scale(${0.5 + 0.5 * eout(u)})`; });
  }
  if (show(komen, t, T.komen - 0.1, T.end_vo + 0.4, null) > 0) { komen.style.top = 1060 + 14 * Math.abs(Math.sin(t * 5)) + "px"; }

  // captions (bottom band)
  let ci = -1; for (let i = 0; i < CAPS.length; i++) if (t >= CAPS[i].a && t < CAPS[i].b) ci = i;
  const hookOn = t < T.ni - 0.1;
  if (ci < 0 || hookOn || t > T.end_vo + 0.6) capEl.style.display = "none";
  else {
    capEl.style.display = "block";
    if (capEl.dataset.i != ci) { capEl.innerHTML = ""; capSpans[ci].forEach((s) => capEl.appendChild(s)); capEl.dataset.i = ci; }
    CAPS[ci].w.forEach((w, j) => { const s = capSpans[ci][j]; s.style.color = t >= w.at - 0.03 ? (w.k ? "#ff2d46" : "#fff") : "rgba(255,255,255,.36)"; });
  }

  const hk = win(t, 0.05, T.ni - 0.3, 0.2, 0.3);
  hook.style.display = hk > 0 ? "block" : "none"; hook.style.opacity = hk;
  const [hb, hc, hl] = hook.children;
  const ub = clamp((t - T.empat + 0.05) / 0.2); hb.style.opacity = ub; hb.style.transform = `scale(${1.45 - 0.45 * eout(ub)})`;
  hc.style.opacity = clamp((t - T.kasut1 + 0.4) / 0.2); hl.style.transform = `scaleX(${eout((t - T.malaysia1 + 0.4) / 0.5)})`;

  tint.style.opacity = Math.max(0.6 * win(t, T.empat, T.empat + 0.3, 0.05, 0.5), 0.5 * win(t, T.pelepasan + 0.2, T.pelepasan + 0.5, 0.05, 0.6), 0.4 * win(t, T.juta, T.juta + 0.3, 0.05, 0.6), 0.5 * win(t, T.t10, T.t10 + 0.3, 0.05, 0.6));

  const ot = T.end_vo + 0.4, ok = win(t, ot, DURATION + 1, 0.4, 0.1);
  outro.style.display = ok > 0 ? "block" : "none"; outro.style.opacity = ok;
  outro.firstElementChild.style.transform = `translateY(${40 * (1 - eout((t - ot) / 0.5))}px)`;
  const followed = t > ot + 1.2; fbtn.textContent = followed ? "Following" : "Follow"; fbtn.style.background = followed ? "#2a2f38" : "#ff2d46";
  const subbed = t > ot + 1.7; sbtn.textContent = subbed ? "Subscribed" : "Subscribe"; sbtn.style.background = subbed ? "#2a2f38" : "#ff2d46";
  fade.style.opacity = clamp((t - (DURATION - 0.45)) / 0.4);
}
window.__renderAt = renderAt;
window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
tl.to({}, { duration: DURATION }, 0);
window.__timelines["main"] = tl;
renderAt(0);
resolveWorld();
</script>
