<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url(../assets/fonts/inter-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:Mono;src:url(../assets/fonts/JetBrainsMono-700.woff2)}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:#05070b;font-family:Inter}
.bg{position:absolute;inset:0;background:url(cover-bg.jpg) center/cover}
.sh{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.3) 30%,rgba(0,0,0,.2) 60%,rgba(0,0,0,.6))}
.t{position:absolute;top:200px;left:0;right:0;text-align:center;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.55),0 8px 30px rgba(0,0,0,.8)}
.big{font:800 190px/0.95 Inter;letter-spacing:-6px;color:#ff2d46}
.s{font:800 64px Inter;letter-spacing:4px;margin-top:10px}
.img{position:absolute;left:250px;top:640px;width:580px;height:720px;border-radius:18px;border:4px solid #fff;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.7);transform:rotate(-3deg)}
.img img{width:100%;height:100%;object-fit:cover}
.img i{position:absolute;right:12px;top:12px;font:700 16px Mono;color:#fff;background:rgba(0,0,0,.55);padding:5px 10px;border-radius:4px;font-style:normal;letter-spacing:2px}
.tag{position:absolute;top:1430px;left:0;right:0;text-align:center}
.tag span{display:inline-block;font:800 44px Inter;color:#fff;background:#ff2d46;padding:12px 26px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
</style></head><body>
<div class="bg"></div><div class="sh"></div>
<div class="t"><div class="big">4 KG EMAS</div><div class="s">DALAM KASUT</div></div>
<div class="img"><img src="../assets/broll/gold.jpg"><i>ILUSTRASI · AI</i></div>
<div class="tag"><span>RM2.25 JUTA · DITAHAN DI PADANG</span></div>
</body></html>
