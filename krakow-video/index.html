<!doctype html>
<html lang="ms" data-composition-variables='[{"id":"previewScale","type":"number","label":"3D render scale (0.5 for previews)","default":1,"min":0.25,"max":1,"step":0.25},{"id":"fx","type":"string","label":"effects override (JSON, testing only)","default":""}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/lib/gsap.min.js"></script>
    <script type="importmap">{ "imports": { "three": "./assets/lib/three.module.min.js" } }</script>
    <style>
      @font-face { font-family: "Montserrat"; font-weight: 800; src: url("assets/fonts/montserrat-latin-800-normal.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #2a2f55; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      #world { position: absolute; inset: 0; }
      #world canvas { width: 1080px; height: 1920px; display: block; }
      /* fact card at the top (y≈230), same font as the captions */
      #stat { position: absolute; left: 0; right: 0; top: 190px; display: flex; justify-content: center; z-index: 5; }
      #stat .card { text-align: center; transform-origin: 50% 60%; }
      #stat .big { font-family: "Montserrat", sans-serif; font-weight: 800; font-size: 150px; line-height: 1; color: #fff;
        -webkit-text-stroke: 18px #000; paint-order: stroke fill; font-variant-numeric: tabular-nums; white-space: nowrap; }
      #stat .sub { margin-top: 18px; font-family: "Montserrat", sans-serif; font-weight: 800; font-size: 46px; color: #fff;
        -webkit-text-stroke: 10px #000; paint-order: stroke fill; letter-spacing: 1px; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="60" data-width="1080" data-height="1920" data-fps="30">
      <div id="world" class="clip" data-start="0" data-duration="60" data-track-index="0" data-track-kind="graphics" data-layout-ignore>
        <canvas id="world-canvas" width="1080" height="1920"></canvas>
      </div>
      <div id="stat" class="clip" data-start="0" data-duration="60" data-track-index="2" data-track-kind="graphics">
        <div class="card" id="stat-card"><div class="big" id="stat-big"></div><div class="sub" id="stat-sub"></div></div>
      </div>
    </div>

    <script>
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      let resolveWorld;
      window.__hf.buildReady["world"] = new Promise((r) => (resolveWorld = r));
    </script>
    <script type="module">
      import { createWorld } from "./assets/world.js";
      import { warp } from "./assets/timing.js";
      const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
      const scale = Number(vars.previewScale) || 1;
      await document.fonts.load('800 40px "Montserrat"');
      let fxOpts = {}; try { fxOpts = vars.fx ? JSON.parse(vars.fx) : {}; } catch (e) {}
      const world = createWorld(document.getElementById("world-canvas"), 1080, 1920, scale, fxOpts);

      // fact cards (canonical time): [start, end, big, sub, colour]
      const mmss = (s) => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
      const STATS = [
        [0.3, 5.0, () => "15:00", "SABTU · 7 NOV 2026", "#fff"],
        [6.0, 13.0, (ct) => mmss(70 * Math.min(1, (ct - 6) / 6.5)), "TEMBAKAN TAK BERHENTI", "#ff5a4a"],
        [13.2, 17.0, () => "15 SAAT", "PANGGILAN KECEMASAN", "#ffc531"],
        [17.0, 21.0, () => "< 3 MIN", "POLIS TIBA", "#7eb6ff"],
        [21.4, 29.0, () => "1 KM", "DARI DATARAN", "#7eb6ff"],
        [29.4, 31.6, () => "6", "TERKORBAN", "#fff"],
        [31.6, 33.6, () => "15", "CEDERA", "#fff"],
        [34.4, 37.0, () => "+3", "DI RUMAH SUSPEK, OSTROWIEC", "#fff"],
        [39.4, 42.0, () => "SAH", "PERMIT SUKAN MENEMBAK", "#ffc531"],
        [42.2, 46.2, () => "PENGGANAS", "KATA PERDANA MENTERI", "#ff5a4a"],
        [48.4, 54.0, () => "JARANG", "TEMBAKAN BESAR-BESARAN DI POLAND", "#a8f07a"],
        [55.0, 60.0, () => "?", "KOMEN KAT BAWAH", "#ffc531"],
      ];
      const card = document.getElementById("stat-card"), big = document.getElementById("stat-big"), sub = document.getElementById("stat-sub");
      const back = (u) => { if (u <= 0) return 0; if (u >= 1) return 1; const c1 = 2.2, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); };
      function drawStat(ct) {
        const s = STATS.find((r) => ct >= r[0] && ct < r[1]);
        if (!s) { card.style.opacity = 0; return; }
        const inU = (ct - s[0]) / 0.35, outU = (s[1] - ct) / 0.25;
        const sc = Math.min(0.6 + 0.4 * back(inU), outU < 1 ? 0.7 + 0.3 * outU : 1);
        big.textContent = s[2](ct); big.style.color = s[4]; sub.textContent = s[3];
        big.style.fontSize = Math.min(150, (1080 * 0.82) / (0.78 * big.textContent.length)) + "px";
        card.style.opacity = Math.min(1, inU * 3, outU * 3); card.style.transform = `scale(${sc})`;
      }
      function renderAt(t) { const ct = warp(t); world.render(ct); drawStat(ct); }
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      renderAt(0);
      resolveWorld();
    </script>
  </body>
</html>
