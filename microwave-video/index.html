      #card .k { font-weight: 800; font-size: 22px; letter-spacing: 3px; color: #6b7183; }

      #cta { position: absolute; left: 0; right: 0; top: 1665px; text-align: center; font-weight: 600; font-size: 34px; color: #4a5060; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="67.967" data-width="1080" data-height="1920" data-fps="30">
      <div id="world" class="clip" data-start="0" data-duration="67.967" data-track-index="0" data-track-kind="graphics" data-layout-ignore>
        <canvas id="world-canvas" width="1080" height="1920"></canvas>
      </div>
      <div id="ui" class="clip" data-start="0" data-duration="67.967" data-track-index="2" data-track-kind="graphics" data-layout-ignore>
        <div class="fade-top"></div><div class="fade-bot"></div>
        <div id="title"></div>
        <div class="hud" id="hud-main"><div class="st"><span class="dot"></span><span class="sl"></span></div><span class="sep"></span><div><span class="val"></span><span class="unit"></span></div></div>
        <div class="hud" id="hud-a"><div class="st"><span class="dot"></span><span class="sl"></span></div><span class="sep"></span><div><span class="val"></span><span class="unit"></span></div></div>
        <div class="hud" id="hud-b"><div class="st"><span class="dot"></span><span class="sl"></span></div><span class="sep"></span><div><span class="val"></span><span class="unit"></span></div></div>
        <div id="labels"></div>

    <script>
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      let resolveWorld;
      window.__hf.buildReady["world"] = new Promise((r) => (resolveWorld = r));
    </script>
    <script type="module">
      import { createWorld } from "./assets/world.js";
      import { warp } from "./assets/timing.js";
      const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
      const scale = Number(vars.previewScale) || 1;
      await Promise.all(["500", "600", "700", "800"].map((w) => document.fonts.load(`${w} 40px "Inter"`)));
      let fxOpts = {}; try { fxOpts = vars.fx ? JSON.parse(vars.fx) : {}; } catch (e) {}
      const world = createWorld(document.getElementById("world-canvas"), 1080, 1920, scale, fxOpts);
      const T = world.T;

      const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
      const ss = (e0, e1, x) => { const u = clamp((x - e0) / (e1 - e0)); return u * u * (3 - 2 * u); };
      const win = (t, t0, t1, fin = 0.3, fout = 0.3) => (t0 <= 0 ? 1 : ss(t0, t0 + fin, t)) * (t1 >= 60 ? 1 : 1 - ss(t1 - fout, t1, t));

      const HOOK = "Panas <em>dari dalam</em>?";
      const CH = [
        [0, 3.1, HOOK], [3.1, 7, "Panas dari dalam? <em>Salah.</em>"], [7, 15, "Jantung dia: <em>magnetron</em>"], [15, 24, "Air <em>berpusing</em> jadi haba"],
        [24, 33, "Tembus <em>2–3 cm</em> je"], [33, 40, "Kenapa pinggan <em>berpusing</em>"], [40, 51, "Oven <em>bakar</em>, microwave <em>goncang</em>"],
        [51, 58.8, "Satu laju, <em>satu rangup</em>"], [58.8, 60, HOOK],
      ];
      const NOTES = [[7.2, 15, "Frekuensi microwave rumah: 2,45 GHz"], [24.2, 33, "Warna keratan = suhu · tembusan lazim 1–3 cm, bergantung pada makanan"],
        [33.2, 40, "Titik panas berjarak ≈ separuh panjang gelombang (12,2 cm ÷ 2)"], [40.2, 51, "Perangan (tindak balas Maillard) perlukan permukaan lebih ~140°C"]];
      const LABELS = [
        ["out.centre", "TENGAH: SEJUK", 4.6, 7.0, 1], ["out.edge", "LUAR: PANAS", 5.4, 7.0, -1],
        ["mag", "MAGNETRON", 9.7, 14.6, 1], ["outlet", "GELOMBANG MIKRO", 11.0, 14.6, -1],
        ["mol", "MOLEKUL AIR", 16.9, 23.8, 1],
        ["band", "2–3 cm", 25.4, 32.8, -1], ["in.centre", "TENGAH", 27.0, 32.8, -1],
        ["spot", "6 cm", 36.4, 39.8, 1], ["plate", "PINGGAN", 37.7, 39.8, 1],
        ["oven.el", "ELEMEN PANAS", 41.4, 50.8, 1], ["oven.d", "RANGUP", 45.8, 50.8, -1], ["mw.d", "LEMBAP", 49.5, 50.8, -1], ["mw.d", "LEMBIK", 58.0, 59.5, -1],
      ];
      const ST = { done: ["Siap", "#22a95b"], cook: ["Memasak", "#ff7a1a"], cold: ["Tengah", "#2f5bff"], spot: ["Titik panas", "#e5483a"], oven: ["Oven", "#e5483a"], mw: ["Microwave", "#2f5bff"] };

      const $ = (s) => document.querySelector(s);
      const titleEl = $("#title"), noteEl = $("#note"), labelsEl = $("#labels"), cta = $("#cta"), rew = $("#rew");
      const lblEls = LABELS.map(() => { const d = document.createElement("div"); d.className = "lbl"; d.innerHTML = '<span class="ln"></span><span class="pt"></span><span class="tx"></span>'; labelsEl.appendChild(d); return d; });
      function setHud(el, st, val, unit, x, y, a) {
        el.style.opacity = a; el.style.left = x + "px"; el.style.top = y + "px";
        const [name, col] = ST[st]; el.querySelector(".dot").style.background = col; el.querySelector(".dot").style.boxShadow = `0 0 0 5px ${col}22`;
        el.querySelector(".sl").textContent = name; el.querySelector(".sl").style.color = col;
        el.querySelector(".val").textContent = val; el.querySelector(".unit").textContent = unit;
      }
      const fmt = (v, d = 1) => v.toFixed(d).replace(".", ",");

      function overlay(o, t) {
        const ch = CH.find(([a, b]) => t >= a && t < b) || CH[CH.length - 1];
        const ta = ch[0] === 3.1 ? 1 : win(t, ch[0], ch[1], 0.35, 0.3) * (ch[1] === 3.1 ? 1 : 1);
        if (titleEl.innerHTML !== ch[2]) titleEl.innerHTML = ch[2];
        titleEl.style.opacity = ch[1] === 3.1 ? 1 : ta; titleEl.style.filter = `blur(${(1 - (ch[1] === 3.1 ? 1 : ta)) * 10}px)`;
        const T2 = o.temps; let a = 1, st = "done", val = fmt(12), unit = "°C tengah";
        if (t < 7.3) { st = "done"; val = fmt(12); unit = "°C tengah"; }
        else if (t < 15) { st = "cook"; val = "2,45"; unit = "GHz"; }
        else if (t < 24) { st = "cook"; val = fmt(T2.mol); unit = "°C"; }
        else if (t < 33) { st = "cold"; val = fmt(T2.centre); unit = "°C"; }
        else if (t < 40) { st = "spot"; val = "6"; unit = "cm"; }
        else if (t < 58.9) { a = 0; }
        else { st = "done"; a = ss(58.9, 59.4, t); }
        if (t >= 39.6 && t < 40.2) a = 1 - ss(39.6, 40.2, t);
        setHud($("#hud-main"), st, val, unit, 540, 300, a);
        const sa = ss(41.0, 41.6, t) * (1 - ss(51.0, 51.6, t));
        const pa = o.anchors["oven.top"], pb = o.anchors["mw.top"];
        setHud($("#hud-a"), "oven", fmt(T2.oven), "°C", pa ? clamp(pa[0], 220, 860) : 270, 560, sa);
        setHud($("#hud-b"), "mw", fmt(T2.mw), "°C", pb ? clamp(pb[0], 220, 860) : 810, 560, sa);
        LABELS.forEach(([k, txt, t0, t1, side], i) => {
          const el = lblEls[i], p = o.anchors[k]; const la = p ? win(t, t0, t1, 0.25, 0.25) : 0;
          el.style.opacity = la; if (la <= 0) return;
          el.style.left = p[0] + "px"; el.style.top = p[1] + "px";
          const L = 110 * ss(t0, t0 + 0.35, t);
          const ln = el.querySelector(".ln"), tx = el.querySelector(".tx");
          ln.style.width = L + "px"; ln.style.left = side > 0 ? "0px" : -L + "px";
          if (tx.textContent !== txt) tx.textContent = txt;
          tx.style.left = side > 0 ? L + "px" : "auto"; tx.style.right = side > 0 ? "auto" : L + "px";
        });
        const n = NOTES.find(([a, b]) => t >= a && t < b);
        noteEl.style.opacity = n ? win(t, n[0], n[1]) : 0; if (n && noteEl.textContent !== n[2]) noteEl.textContent = n[2];
        cta.style.opacity = win(t, 52.0, 55.0, 0.3, 0.4);
        rew.style.opacity = 0;
      }
      function renderAt(t) { const ct = warp(t); const o = world.render(ct); overlay(o, ct); }
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      renderAt(0);
      resolveWorld();
    </script>
