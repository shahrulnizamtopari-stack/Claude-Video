function zoomMod(t) {
  let m = 0;
  for (const [a, amt, hold] of ZP) { const x = t - a + 0.08; if (x < 0 || x > hold + 1.6) continue;
    m += amt * ease(clamp(x / 0.3)) * (1 - ease(clamp((x - 0.3 - hold) / 1.3))); }
  return (1 + m) * (1 - 0.03 * Math.sin(t * 0.9));

function cam(t) {
  let i = 0; while (i < K.length - 2 && t > K[i + 1][0]) i++;

  const L = (k) => A[k] + (B[k] - A[k]) * u;
  const hop = Math.sin(Math.PI * u) * Math.min(1.4, Math.hypot(B[1] - A[1], B[2] - A[2]) * 0.012) * (Math.hypot(B[1] - A[1], B[2] - A[2]) > 20 ? 1 : 0);
  const d = Math.exp(Math.log(A[3]) + (Math.log(B[3]) - Math.log(A[3])) * u) + hop;
  return { lat: L(1), lon: ((L(2) + 180) % 360 + 360) % 360 - 180, dist: d * zoomMod(t), tilt: L(4), yShift: L(5) };
}
