<script type="module">
import { createGlobe } from "./assets/globe.js";
import { DURATION, T, CAPS } from "./assets/story.js";

const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
const LAYER = Number(vars.layer) || 0;
if (LAYER === 1) document.documentElement.classList.add("clean");
if (LAYER === 2) document.documentElement.classList.add("caps");
const scale = LAYER === 2 ? 0.25 : Number(vars.previewScale) || 1;
await Promise.all(["400 40px Inter", "700 40px Inter", "800 40px Inter", "700 20px Mono", "400 40px Serif", "italic 700 40px Serif", "700 40px Serif"].map((f) => document.fonts.load(f)));

const W = 1080, H = 1920;
const g = await createGlobe(document.getElementById("gl"), { W, H, base: "assets/", scale });
if (LAYER === 2) g.render = () => {};
const topo = await (await fetch("assets/geo/countries-10m.json")).json();
const countries = topojson.feature(topo, topo.objects.countries).features;
const ST = (await (await fetch("assets/geo/my-states.json")).json()).features;

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eout = (x) => 1 - Math.pow(1 - clamp(x), 3);
const win = (t, a, b, fi = 0.35, fo = 0.35) => clamp((t - a) / fi) * (1 - clamp((t - b) / fo));

// ---------------- overlay layers ----------------
const borders = g.layer("borders", 0, { lon0: 92, lon1: 140, lat0: -6, lat1: 34, ppd: 80 });
{ const L = borders, c = L.ctx; c.strokeStyle = "rgba(255,255,255,.35)"; c.lineWidth = 1; c.lineJoin = "round";
  for (const f of countries) { L.path(f.geometry); c.stroke(); } L.tex.needsUpdate = true; }
const stl = g.layer("states", 1, { lon0: 99, lon1: 120, lat0: 0.5, lat1: 7.5, ppd: 160 });
{ const L = stl, c = L.ctx; c.lineJoin = "round"; c.strokeStyle = "rgba(255,255,255,.4)"; c.lineWidth = 1.2; for (const f of ST) { L.path(f.geometry); c.stroke(); } L.tex.needsUpdate = true; }

// ---------------- camera ----------------
const SUBANG = [3.13, 101.55], LABUAN = [5.28, 115.24], TAWAU = [4.24, 117.89], KV = [3.08, 101.70];
const K = [
  [0, 5.5, 109, 1.6, 6, -0.1], [T.ni - 0.3, 3.3, 103.5, 0.7, 10, -0.1],
  [T.subang - 0.4, 3.13, 101.6, 0.13, 20, 0.2], [T.ujian - 0.3, 3.13, 101.6, 0.12, 20, 0.2],
  [T.ujian + 0.4, 3.13, 101.6, 0.14, 20, 0.2], [T.polis, 3.13, 101.6, 0.14, 20, 0.2],
  [T.polis + 0.9, 4.4, 108.6, 1.15, 8, 0.16], [T.panglima - 0.2, 4.4, 108.8, 1.1, 8, 0.16],
  [T.panglima + 0.7, 3.13, 101.6, 0.2, 18, 0.2], [T.tawau - 0.2, 3.13, 101.6, 0.19, 18, 0.2],
  [T.tawau + 0.7, 4.9, 116.6, 0.42, 14, 0.13], [T.tudm3 - 0.2, 4.9, 116.6, 0.4, 14, 0.13],
  [T.tudm3 + 0.7, 3.13, 101.6, 0.15, 20, 0.12], [T.siasatan, 3.13, 101.6, 0.14, 20, 0.12],
  [DURATION, 3.3, 101.8, 0.35, 14, 0.05],
];
const ZP = [
  [T.k96, -0.14, 0.5], [T.subang, -0.10, 0.5], [T.pelekat, -0.10, 0.4], [T.bungkusan, -0.12, 0.5], [T.k97, -0.14, 0.6],
  [T.s11, -0.10, 0.5], [T.s7, -0.10, 0.5], [T.juruterbang, -0.10, 0.4], [T.direman, -0.12, 0.5], [T.kompromi, -0.08, 0.4],
  [T.tentera2, -0.14, 0.5], [T.didakwa, -0.16, 0.6],
];
function zoomMod(t) {
  let m = 0;
  for (const [a, amt, hold] of ZP) { const x = t - a + 0.08; if (x < 0 || x > hold + 1.6) continue;
    m += amt * ease(clamp(x / 0.3)) * (1 - ease(clamp((x - 0.3 - hold) / 1.3))); }
  return (1 + m) * (1 - 0.03 * Math.sin(t * 0.9));
}
function cam(t) {
  let i = 0; while (i < K.length - 2 && t > K[i + 1][0]) i++;
  const A = K[i], B = K[i + 1], u = ease(clamp((t - A[0]) / (B[0] - A[0])));
  const L = (k) => A[k] + (B[k] - A[k]) * u;
  const hop = Math.sin(Math.PI * u) * Math.min(0.6, Math.hypot(B[1] - A[1], B[2] - A[2]) * 0.04) * (Math.abs(B[3] - A[3]) < 1 ? 1 : 0);
  const d = Math.exp(Math.log(A[3]) + (Math.log(B[3]) - Math.log(A[3])) * u) + hop;
  return { lat: L(1), lon: L(2), dist: d * zoomMod(t), tilt: L(4), yShift: L(5) };
}

// ---------------- HTML ----------------
const pinWrap = document.getElementById("pins"), cardWrap = document.getElementById("cards");
const mk = (parent, cls, html) => { const e = document.createElement("div"); e.className = "el " + cls; e.innerHTML = html; parent.appendChild(e); return e; };
const loc = (txt, sub, red) => `<div class="dot ${red ? "red" : ""}"></div><div style="display:flex;flex-direction:column;align-items:flex-start;gap:6px"><div class="lab">${txt}</div>${sub ? `<div class="sub ${red ? "red" : ""}">${sub}</div>` : ""}</div>`;
const PINS = [
  { ll: SUBANG, txt: "SUBANG", sub: "", red: 1, a: 0.9, b: T.ni - 0.3 },
  { ll: SUBANG, txt: "PANGKALAN UDARA SUBANG", sub: "17 NOV · RONDAAN RUTIN", red: 1, a: T.subang, b: T.polis + 0.3 },
  { ll: KV, txt: "LEMBAH KLANG", sub: "OPERASI POLIS", red: 1, a: T.lembah, b: T.panglima },
  { ll: LABUAN, txt: "LABUAN", sub: "OPERASI POLIS", red: 1, a: T.labuan, b: T.panglima },
  { ll: TAWAU, txt: "TAWAU", sub: "REMAN 7 HARI", red: 1, a: T.tawau + 0.2, b: T.tudm3 },
  { ll: LABUAN, txt: "LABUAN", sub: "OPERASI POLIS", a: T.tawau + 0.5, b: T.tudm3 },
  { ll: SUBANG, txt: "PANGKALAN UDARA SUBANG", sub: "SIASATAN BERJALAN", red: 1, a: T.tudm3 + 0.6, b: T.end_vo },
].map((p) => ({ ...p, el: mk(pinWrap, "pin lpin", loc(p.txt, p.sub, p.red)) }));

const card = (outlet, date, head, foot) => mk(cardWrap, "card", `<div class="hd"><b>${outlet}</b><i>${date}</i></div><div class="bd">${head}<div class="ft">${foot}</div></div>`);
const C = {
  fmt: card("FREE MALAYSIA TODAY", "20 NOV 2026", `Bagasi tanpa pelekat keselamatan cetus <mark>penemuan 96kg dadah</mark>`, "Tajuk asal · freemalaysiatoday.com"),
  tv3: card("BULETIN TV3", "20 NOV 2026", `Seludup dadah: <mark>Juruterbang TUDM</mark> berpangkat Leftenan dan Kapten antara ditahan`, "Tajuk asal · buletintv3.my"),
  bh1: card("BERITA HARIAN", "19 NOV 2026", `Edar dadah guna aset tentera: <mark>Dua anggota TUDM direman</mark>`, "Tajuk asal · bharian.com.my · Seksyen 39B ADB 1952"),
  bh2: card("BERITA HARIAN", "20 NOV 2026", `Kes dadah 96.6kg: TUDM sahkan 7 anggota, pegawainya ditahan, <mark>tekad tak akan berkompromi</mark>`, "Tajuk asal · bharian.com.my"),
};
const SCH = [[C.fmt, T.syabu2 - 0.1, T.polis - 0.1, 1450], [C.tv3, T.laporan - 0.1, T.tawau - 0.2, 1300], [C.bh1, T.direman - 0.4, T.tudm3 - 0.1, 1150], [C.bh2, T.tudm3 - 0.1, T.siasatan - 0.1, 1230]];
const HL = [[C.fmt, T.syabu2, T.syabu2 + 0.9], [C.tv3, T.juruterbang - 0.4, T.juruterbang + 0.5], [C.bh1, T.direman - 0.1, T.direman + 0.8], [C.bh2, T.kompromi - 0.6, T.kompromi + 0.4]];

// stat
const stat = mk(cardWrap, "stat", `<div class="k">SYABU DIRAMPAS · UJIAN AWAL</div><div><div class="n"><span class="v">0</span></div></div><div class="u">KILOGRAM</div><div class="bar"><div></div></div>`);
stat.querySelector(".n").style.fontSize = "200px";
// bags
const bagSvg = `<svg width="110" height="130" viewBox="0 0 110 130"><rect x="38" y="4" width="34" height="18" rx="6" fill="none" stroke="#9aa3ad" stroke-width="5"/><rect x="6" y="20" width="98" height="104" rx="12" fill="#14171d" stroke="#3a404b" stroke-width="3"/>${[0, 1, 2, 3, 4].map((i) => `<path d="M6 ${34 + i * 20} L104 ${26 + i * 20}" stroke="rgba(255,255,255,.18)" stroke-width="3"/>`).join("")}<g class="pk"><rect x="24" y="44" width="62" height="30" rx="4" fill="#ff9a3c"/><rect x="24" y="80" width="62" height="30" rx="4" fill="#ff9a3c" opacity=".8"/></g></svg>`;
const bags = mk(cardWrap, "bags", `<div class="k">5 BEG · DEKAT TUNTUTAN BAGASI</div><div class="row">${[0, 1, 2, 3, 4].map(() => `<div class="bg">${bagSvg}</div>`).join("")}</div><div class="scan"></div><div class="nost"><span class="st">PELEKAT SARINGAN</span><span class="x">✕ TIADA</span></div>`);
const bagEls = [...bags.querySelectorAll(".bg")], pkEls = [...bags.querySelectorAll(".pk")], scanEl = bags.querySelector(".scan"), nostX = bags.querySelector(".x"), bagsK = bags.querySelector(".k");
// people grids
const person = (c) => `<svg width="44" height="58" viewBox="0 0 44 58"><circle cx="22" cy="14" r="11" fill="${c}"/><path d="M2 58 Q2 30 22 30 Q42 30 42 58Z" fill="${c}"/></svg>`;
const ppl = (k, groups, foot) => mk(cardWrap, "ppl", `<div class="k">${k}</div><div class="row">${groups.map(([n, c, lab]) => `<div class="grp"><div class="ic">${Array.from({ length: n }, () => person(c)).join("")}</div><div class="gl" style="color:${c}">${n} ${lab}</div></div>`).join("")}</div><div class="ft2">${foot}</div>`);
const P1 = ppl("POLIS · 11 DITAHAN", [[5, "#ff2d46", "ANGGOTA TUDM"], [6, "#9aa3ad", "ORANG AWAM"]], "Lembah Klang & Labuan · menurut polis");
const P2 = ppl("PANGLIMA TUDM · 7 ANGGOTA DITAHAN", [[5, "#ffce00", "PEGAWAI"], [2, "#ff2d46", "LAIN-LAIN PANGKAT"]], "Kenyataan Panglima TUDM · Berita Harian");
const P1i = [...P1.querySelectorAll("svg")], P2i = [...P2.querySelectorAll("svg")], P1g = [...P1.querySelectorAll(".gl")], P2g = [...P2.querySelectorAll(".gl")];
const stampEl = mk(cardWrap, "stamp", "BELUM DIDAKWA"); stampEl.style.fontSize = "64px";

const capEl = document.getElementById("cap");
const capSpans = CAPS.map((c) => c.w.map((w, i) => { const s = document.createElement("span"); s.textContent = w.t + (i < c.w.length - 1 ? " " : ""); return s; }));
const hook = document.getElementById("hook"), outro = document.getElementById("outro"), fade = document.getElementById("fade"), tint = document.getElementById("tint");
const fbtn = document.getElementById("fbtn"), sbtn = document.getElementById("sbtn");
document.getElementById("fx").style.display = "none";

// framed FLOW B-roll windows (timing lives on the <video> tags)
const BR = ["plane2", "bags", "plane1"].map((k) => { const v = document.getElementById("v-" + k);
  return { w: document.getElementById("bw-" + k), a: +v.dataset.start, b: +v.dataset.start + +v.dataset.duration }; });
const brollEl = document.getElementById("broll"), vigEl = document.querySelector(".vig");
function brollAt(t) {
  let on = 0;
  for (const c of BR) { const k = win(t, c.a, c.b - 0.2, 0.2, 0.2); on = Math.max(on, k);
    c.w.style.opacity = k > 0 ? 1 : 0; c.w.style.transform = `scale(${1.02 + 0.06 * clamp((t - c.a) / (c.b - c.a))})`; }
  brollEl.style.opacity = on; brollEl.style.transform = `scale(${0.86 + 0.14 * eout(on)})`;
  vigEl.style.opacity = 1 - on * 0.3; pinWrap.style.opacity = 1 - on;
}
const show = (el, t, a, b, top, disp = "block") => {
  const k = win(t, a, b, 0.3, 0.25);
  if (k <= 0) { el.style.display = "none"; return 0; }
  el.style.display = disp; el.style.opacity = k; if (top != null) el.style.top = top + 50 * (1 - eout((t - a) / 0.4)) + "px"; return k;
};
const popIcons = (els, t, a, step) => els.forEach((e, i) => { const u = clamp((t - a - i * step) / 0.2); e.style.opacity = u; e.style.transform = `scale(${0.4 + 0.6 * eout(u)})`; });

function renderAt(t) {
  brollAt(t);
  const v = cam(t); g.setView(v); g.render();

  for (const p of PINS) {
    const k = win(t, p.a, p.b, 0.25, 0.25);
    if (k <= 0) { p.el.style.display = "none"; continue; }
    const s = g.project(p.ll[0], p.ll[1]);
    if (!s.visible) { p.el.style.display = "none"; continue; }
    p.el.style.display = "flex"; p.el.style.left = s.x + "px"; p.el.style.top = s.y + "px"; p.el.style.opacity = k;
    const pulse = p.red ? 1 + 0.06 * Math.sin(t * 6) : 1;
    p.el.style.transform = `translate(-13px,-50%) scale(${(0.7 + 0.3 * eout((t - p.a) / 0.25)) * pulse})`;
  }

  for (const [el, a, b, top] of SCH) show(el, t, a, b, top);
  for (const [el, a, b] of HL) for (const m of el.querySelectorAll("mark")) m.style.backgroundSize = `${100 * clamp((t - a) / (b - a))}% 100%`;

  // bags: appear one by one, sticker missing, X-ray pass lights the packages
  if (show(bags, t, T.bagasi + 0.3, T.ujian - 0.1, 1080) > 0) {
    popIcons(bagEls, t, T.bagasi + 0.3, 0.1);
    nostX.style.opacity = clamp((t - T.pelekat) / 0.2); nostX.style.transform = `scale(${1.6 - 0.6 * eout((t - T.pelekat) / 0.25)})`; nostX.style.display = "inline-block";
    const su = clamp((t - T.diimbas) / 1.1); scanEl.style.display = su > 0 && su < 1 ? "block" : "none"; scanEl.style.left = su * 800 + "px";
    pkEls.forEach((p, i) => { const lit = su >= (77 + 55 + i * 134) / 800; p.style.opacity = lit ? 0.95 * (0.85 + 0.15 * Math.sin(t * 8 + i)) : 0; });
    bagsK.textContent = t >= T.diimbas ? "IMBASAN · PASUKAN HANDAU TUDM" : "5 BEG · DEKAT TUNTUTAN BAGASI";
  }
  // stat 96.6 kg
  if (show(stat, t, T.ujian - 0.1, T.polis - 0.1, 900) > 0) {
    const u = eout((t - T.k97 + 0.3) / 0.9); stat.querySelector(".v").textContent = (96.6 * u).toFixed(1);
    stat.querySelector(".bar div").style.width = 100 * u * 0.97 + "%";
    stat.querySelector(".u").textContent = t >= T.rm - 0.1 ? "KILOGRAM · ≈ RM4.83 JUTA" : "KILOGRAM";
  }
  if (show(P1, t, T.s11 - 0.3, T.panglima - 0.1, 1060) > 0) { popIcons(P1i, t, T.s11 - 0.2, 0.07); P1g[0].style.opacity = clamp((t - T.s11) / 0.3); P1g[1].style.opacity = clamp((t - T.s11 - 0.3) / 0.3); }
  if (show(P2, t, T.panglima, T.tawau - 0.2, 820) > 0) { popIcons(P2i, t, T.s7 - 0.2, 0.09); P2g[0].style.opacity = clamp((t - T.pegawai + 0.2) / 0.3); P2g[1].style.opacity = clamp((t - T.lain + 0.2) / 0.3); }
  // stamp
  { const on = win(t, T.didakwa, T.end_vo + 0.3, 0.05, 0.3), u = clamp((t - T.didakwa) / 0.22);
    stampEl.style.display = on > 0 ? "block" : "none"; stampEl.style.left = "260px"; stampEl.style.top = "640px"; stampEl.style.opacity = on;
    stampEl.style.transform = `rotate(-8deg) scale(${1.7 - 0.7 * eout(u)})`; }

  // captions
  let ci = -1; for (let i = 0; i < CAPS.length; i++) if (t >= CAPS[i].a && t < CAPS[i].b) ci = i;
  const hookOn = t < T.ni - 0.1;
  if (ci < 0 || hookOn || t > T.end_vo + 0.6) capEl.style.display = "none";
  else {
    capEl.style.display = "block";
    if (capEl.dataset.i != ci) { capEl.innerHTML = ""; capSpans[ci].forEach((s) => capEl.appendChild(s)); capEl.dataset.i = ci; }
    CAPS[ci].w.forEach((w, j) => { const s = capSpans[ci][j]; s.style.color = t >= w.at - 0.03 ? (w.k ? "#ff2d46" : "#fff") : "rgba(255,255,255,.36)"; });
  }

  // hook
  const hk = win(t, 0.05, T.ni - 0.3, 0.2, 0.3);
  hook.style.display = hk > 0 ? "block" : "none"; hook.style.opacity = hk;
  const [hb, hc, ha, hl] = hook.children;
  const ub = clamp((t - T.k96 + 0.05) / 0.2); hb.style.opacity = ub; hb.style.transform = `scale(${1.45 - 0.45 * eout(ub)})`;
  hc.style.opacity = clamp((t - T.syabu1 + 0.1) / 0.2);
  ha.style.opacity = clamp((t - T.dijumpai) / 0.25); ha.style.transform = `translateY(${20 * (1 - eout((t - T.dijumpai) / 0.3))}px)`;
  hl.style.transform = `scaleX(${eout((t - T.tentera1 + 0.3) / 0.5)})`;

  tint.style.opacity = Math.max(0.7 * win(t, T.k96, T.k96 + 0.3, 0.05, 0.5), 0.5 * win(t, T.syabu2, T.syabu2 + 0.3, 0.05, 0.6), 0.5 * win(t, T.bungkusan, T.bungkusan + 0.3, 0.05, 0.6), 0.6 * win(t, T.didakwa, T.didakwa + 0.3, 0.05, 0.6));

  const ot = T.end_vo + 0.4, ok = win(t, ot, DURATION + 1, 0.4, 0.1);
  outro.style.display = ok > 0 ? "block" : "none"; outro.style.opacity = ok;
  outro.firstElementChild.style.transform = `translateY(${40 * (1 - eout((t - ot) / 0.5))}px)`;
  const followed = t > ot + 1.2; fbtn.textContent = followed ? "Following" : "Follow"; fbtn.style.background = followed ? "#2a2f38" : "#ff2d46";
  const subbed = t > ot + 1.7; sbtn.textContent = subbed ? "Subscribed" : "Subscribe"; sbtn.style.background = subbed ? "#2a2f38" : "#ff2d46";
  fade.style.opacity = clamp((t - (DURATION - 0.45)) / 0.4);
}
window.__renderAt = renderAt;
window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
tl.to({}, { duration: DURATION }, 0);
window.__timelines["main"] = tl;
renderAt(0);
resolveWorld();
</script>
