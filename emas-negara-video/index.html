  const d = Math.exp(Math.log(A[3]) + (Math.log(B[3]) - Math.log(A[3])) * u) + hop;
  return { lat: L(1), lon: ((L(2) + 180) % 360 + 360) % 360 - 180, dist: d * zoomMod(t), tilt: L(4), yShift: L(5) };
}

const pinWrap = document.getElementById("pins"), cardWrap = document.getElementById("cards");

const capEl = document.getElementById("cap");
const capSpans = CAPS.map((c) => c.w.map((w, i) => { const s = document.createElement("span"); s.textContent = w.t + (i < c.w.length - 1 ? " " : ""); return s; }));
const hook = document.getElementById("hook"), outro = document.getElementById("outro"), fade = document.getElementById("fade"), tint = document.getElementById("tint");

const show = (el, t, a, b, top, disp = "block") => {

};
const CUT = 2.1;

function renderAt(t) {
  // hook B: AI pour clip, white flash, then the animated rise into the cube beside a house
  pour.style.opacity = t < CUT ? 1 : 0;
  pour.firstElementChild.style.transform = `scale(${1.04 + 0.06 * clamp(t / CUT)})`;
  flash.style.opacity = Math.max(0, 1 - Math.abs(t - CUT) / 0.18) * 0.9;
  const hEnd = T.ni - 0.1, ha = win(t, CUT, hEnd, 0.01, 0.35);
  if (ha > 0) { hookA.style.display = "block"; hookA.style.opacity = ha; hookRender(2.2 + (t - CUT) * 0.92); } else hookA.style.display = "none";

  const v = cam(t); g.setView(v);

  myl.mesh.material.opacity = win(t, T.malaysia - 0.2, DURATION, 0.4, 0.4);

    s.ex.style.opacity = EXTRA[s.k][1] ? clamp((t - EXTRA[s.k][1]) / 0.3) : 0;

  }
  if (show(myc, t, T.malaysia - 0.1, T.korang - 0.15, 900) > 0) myc.querySelector(".num").style.transform = `scale(${1.3 - 0.3 * eout((t - T.tak) / 0.25)})`;
  if (show(vs, t, T.korang - 0.1, T.end_vo + 0.4, null, "flex") > 0) {
    vs.style.top = "560px"; optA.style.transform = `scale(${1 + 0.08 * win(t, T.patut, T.patut + 0.6, 0.1, 0.3)})`;
  }
  if (show(bubs, t, T.patut + 0.3, T.end_vo + 0.4, null, "flex") > 0) { bubs.style.top = "1000px";
    bubEls.forEach((b, i) => { const u = clamp((t - T.patut - 0.4 - i * 0.35) / 0.25); b.style.opacity = u; b.style.transform = `scale(${0.5 + 0.5 * eout(u)})`; }); }
  if (show(komen, t, T.komen - 0.1, T.end_vo + 0.4, null) > 0) komen.style.top = 1200 + 14 * Math.abs(Math.sin(t * 5)) + "px";

  let ci = -1; for (let i = 0; i < CAPS.length; i++) if (t >= CAPS[i].a && t < CAPS[i].b) ci = i;
  if (ci < 0 || t > T.end_vo + 0.6) capEl.style.display = "none";
  else {
    capEl.style.display = "block";
    if (capEl.dataset.i != ci) { capEl.innerHTML = ""; capSpans[ci].forEach((s) => capEl.appendChild(s)); capEl.dataset.i = ci; }
    CAPS[ci].w.forEach((w, j) => { const s = capSpans[ci][j]; s.style.color = t >= w.at - 0.03 ? (w.k ? "#ff2d46" : "#fff") : "rgba(255,255,255,.36)"; });
  }

  const hk = win(t, T.ni - 0.1, T.n5 - 0.4, 0.25, 0.3);
  hook.style.display = hk > 0 ? "block" : "none"; hook.style.opacity = hk;
  const [h1, h2, h3, h4] = hook.children; const ub = clamp((t - T.ni) / 0.25);

  tint.style.opacity = 0.4 * win(t, T.s8133, T.s8133 + 0.3, 0.05, 0.6);

  const followed = t > ot + 1.2; fbtn.textContent = followed ? "Following" : "Follow"; fbtn.style.background = followed ? "#2a2f38" : "#ff2d46";
  const subbed = t > ot + 1.7; sbtn.textContent = subbed ? "Subscribed" : "Subscribe"; sbtn.style.background = subbed ? "#2a2f38" : "#ff2d46";
  fade.style.opacity = clamp((t - (DURATION - 0.45)) / 0.4);
}
