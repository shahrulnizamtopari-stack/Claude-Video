<!doctype html>
<html lang="ms" data-composition-variables='[{"id":"previewScale","type":"number","label":"3D render scale (0.5 for previews)","default":1,"min":0.25,"max":1,"step":0.25},{"id":"fx","type":"string","label":"effects override (JSON, testing only)","default":""}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/lib/gsap.min.js"></script>
    <script type="importmap">{ "imports": { "three": "./assets/lib/three.module.min.js" } }</script>
    <style>
      @font-face { font-family: "Lexend"; font-weight: 500; src: url("assets/fonts/lexend-latin-500-normal.woff2") format("woff2"); }
      @font-face { font-family: "Lexend"; font-weight: 600; src: url("assets/fonts/lexend-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Lexend"; font-weight: 700; src: url("assets/fonts/lexend-latin-700-normal.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0c0908; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Lexend", sans-serif; color: #fff; }
      #world { position: absolute; inset: 0; }
      #world canvas { width: 1080px; height: 1920px; display: block; }
      #ui { position: absolute; inset: 0; }
      .cap { position: absolute; left: 90px; right: 90px; top: 1182px; text-align: center; font-weight: 600; font-size: 50px; line-height: 1.22; letter-spacing: -0.2px; text-shadow: 0 2px 4px rgba(0,0,0,0.9), 0 0 18px rgba(0,0,0,0.75), 0 0 36px rgba(0,0,0,0.5); }
      .cap .w, .title .w { display: inline-block; white-space: pre; }
      .k { color: #ff8a2a; text-shadow: 0 2px 4px rgba(0,0,0,0.9), 0 0 16px rgba(255,122,26,0.9), 0 0 30px rgba(0,0,0,0.6); }
      .title { position: absolute; left: 70px; right: 70px; top: 300px; text-align: center; font-weight: 700; font-size: 68px; line-height: 1.18; text-shadow: 0 3px 16px rgba(0,0,0,0.6); }
      #pill { position: absolute; left: 62px; top: 1352px; height: 50px; padding: 0 20px 0 8px; border-radius: 25px; background: #f4f4f2; color: #16161a; font-weight: 600; font-size: 25px; display: flex; align-items: center; gap: 10px; }
      #pill i { width: 34px; height: 34px; border-radius: 50%; background: #16161a; color: #fff; font-style: normal; font-size: 19px; display: flex; align-items: center; justify-content: center; }
      .lab { position: absolute; left: 0; top: 0; font-weight: 500; font-size: 31px; white-space: nowrap; text-shadow: 0 2px 10px rgba(0,0,0,0.7); transform: translate(-50%, -50%); }
      .lab.hi { color: #ff7a1a; text-shadow: 0 0 16px rgba(255,122,26,0.8); }
      #lines { position: absolute; inset: 0; overflow: visible; }
      #lines line { stroke: rgba(255,255,255,0.75); stroke-width: 1.6; }
      #lines circle { fill: #ffb070; }
      #lines .halo { fill: rgba(255,122,26,0.35); }
      #fade { position: absolute; inset: 0; background: #000; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="48" data-width="1080" data-height="1920" data-fps="30">
      <div id="world" class="clip" data-start="0" data-duration="48" data-track-index="0" data-track-kind="graphics" data-layout-ignore>
        <canvas id="world-canvas" width="1080" height="1920"></canvas>
      </div>
      <div id="ui" class="clip" data-start="0" data-duration="48" data-track-index="1" data-track-kind="graphics" data-layout-ignore>
        <svg id="lines" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
        <div id="labels"></div>
        <div id="caps"></div>
        <div id="pill"><i id="pill-i"></i><span id="pill-t"></span></div>
        <div id="fade"></div>
      </div>
      <audio id="sfx" class="clip" src="assets/sfx.wav" data-start="0" data-duration="48" data-track-index="6" data-volume="0.5"></audio>
      <audio id="vo" class="clip" src="assets/voiceover.mp3" data-start="0" data-duration="44.74" data-track-index="5" data-volume="1"></audio>
    </div>

    <script>
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      let resolveWorld;
      window.__hf.buildReady["world"] = new Promise((r) => (resolveWorld = r));
    </script>
    <script type="module">
      import { createWorld } from "./assets/world.js";
      import { LINES } from "./assets/story.js";
      import { LABELS, HANDLE, DURATION, END_TITLE, END_LINE } from "./assets/beats.js";
      const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
      const scale = Number(vars.previewScale) || 1;
      await Promise.all([500, 600, 700].map((w) => document.fonts.load(`${w} 40px "Lexend"`)));
      let fxOpts = {}; try { fxOpts = vars.fx ? JSON.parse(vars.fx) : {}; } catch (e) {}
      const world = createWorld(document.getElementById("world-canvas"), 1080, 1920, scale, fxOpts);
      const clamp = (v) => Math.min(1, Math.max(0, v));
      const NS = "http://www.w3.org/2000/svg";

      document.getElementById("pill-i").textContent = HANDLE[0].toUpperCase();
      document.getElementById("pill-t").textContent = HANDLE;

      // captions: every line is laid out whole, words fade/slide in one by one
      const caps = document.getElementById("caps");
      const mk = (cls, words, a, b) => { const el = document.createElement("div"); el.className = cls; caps.appendChild(el);
        return { el, a, b, words: words.map((w, i) => { const sp = document.createElement("span"); sp.className = "w" + (w.k ? " k" : ""); sp.textContent = w.t + (i < words.length - 1 ? " " : ""); el.appendChild(sp); return { s: sp, at: w.at }; }) }; };
      const spread = ([a, b, text]) => { const ws = text.split(" "); return [ws.map((raw, i) => ({ t: raw.replace(/\*/g, ""), k: raw.startsWith("*"), at: a + (i * 0.22) })), a, b]; };
      const lines = [...LINES.map((l) => mk("cap", l.words, l.a, l.b)), mk("title", ...spread(END_TITLE)), mk("cap", ...spread(END_LINE))];
      function drawCaps(t) {
        for (const L of lines) {
          const out = clamp((t - L.b + 0.06) / 0.1), on = t >= L.a - 0.05 && out < 1;
          L.el.style.display = on ? "block" : "none"; if (!on) continue;
          L.el.style.opacity = 1 - out;
          for (const w of L.words) { const u = clamp((t - w.at + 0.04) / 0.12); w.s.style.opacity = u; w.s.style.transform = `translateY(${(1 - u) * 10}px)`; }
        }
      }

      // labels: text + thin leader line to a pulsing dot that follows the 3D anchor
      const labWrap = document.getElementById("labels"), svg = document.getElementById("lines");
      const labs = LABELS.map(([anchor, text, a, b, off, hi]) => {
        const el = document.createElement("div"); el.className = "lab"; el.textContent = text; labWrap.appendChild(el);
        const g = document.createElementNS(NS, "g"); svg.appendChild(g);
        const ln = document.createElementNS(NS, "line"), halo = document.createElementNS(NS, "circle"), dot = document.createElementNS(NS, "circle");
        halo.setAttribute("class", "halo"); g.append(ln, halo, dot);
        return { anchor, a, b, off, hi, el, g, ln, halo, dot };
      });
      function drawLabels(t) {
        for (const l of labs) {
          const k = clamp((t - l.a) / 0.3) * (1 - clamp((t - l.b) / 0.25));
          if (k <= 0) { l.el.style.display = "none"; l.g.style.display = "none"; continue; }
          const p = world.project(l.anchor), tx = p.x + l.off[0], ty = p.y + l.off[1];
          l.el.style.display = "block"; l.g.style.display = "block"; l.el.style.opacity = k; l.g.style.opacity = k;
          l.el.style.transform = `translate(${tx}px, ${ty}px) translate(-50%, -50%)`;
          l.el.classList.toggle("hi", !!l.hi && t >= l.hi[0] && t <= l.hi[1]);
          const dx = p.x - tx, dy = p.y - ty, len = Math.hypot(dx, dy), gap = 26;
          l.ln.setAttribute("x1", tx + (dx / len) * gap * 1.6); l.ln.setAttribute("y1", ty + (dy / len) * gap);
          l.ln.setAttribute("x2", tx + dx * (0.3 + 0.7 * k)); l.ln.setAttribute("y2", ty + dy * (0.3 + 0.7 * k));
          l.dot.setAttribute("cx", p.x); l.dot.setAttribute("cy", p.y); l.dot.setAttribute("r", 5);
          l.halo.setAttribute("cx", p.x); l.halo.setAttribute("cy", p.y); l.halo.setAttribute("r", 11 + 4 * Math.sin(t * 5));
        }
      }
      const fade = document.getElementById("fade");
      function renderAt(t) {
        world.render(t); drawCaps(t); drawLabels(t);
        fade.style.opacity = clamp((t - (DURATION - 0.7)) / 0.55);
      }
      window.__renderAt = renderAt;
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: DURATION }, 0);
      window.__timelines["main"] = tl;
      renderAt(0);
      resolveWorld();
    </script>
  </body>
</html>
