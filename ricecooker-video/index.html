<!doctype html>
<html lang="ms" data-composition-variables='[{"id":"previewScale","type":"number","label":"3D render scale (0.5 for previews)","default":1,"min":0.25,"max":1,"step":0.25},{"id":"fx","type":"string","label":"effects override (JSON, testing only)","default":""}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/lib/gsap.min.js"></script>
    <script type="importmap">{ "imports": { "three": "./assets/lib/three.module.min.js" } }</script>
    <style>
      @font-face { font-family: "Inter"; font-weight: 500; src: url("assets/fonts/inter-latin-500-normal.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 600; src: url("assets/fonts/inter-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 700; src: url("assets/fonts/inter-latin-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 800; src: url("assets/fonts/inter-latin-800-normal.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #eef1f8; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Inter", sans-serif; }
      #world { position: absolute; inset: 0; }
      #world canvas { width: 1080px; height: 1920px; display: block; }
      #ui { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
      .fade-top { position: absolute; left: 0; right: 0; top: 0; height: 520px; background: linear-gradient(#eef1f8 0%, rgba(238,241,248,0.92) 40%, rgba(238,241,248,0) 100%); }
      .fade-bot { position: absolute; left: 0; right: 0; bottom: 0; height: 420px; background: linear-gradient(rgba(240,242,248,0), rgba(240,242,248,0.85) 70%, #f0f2f8); }
      #title { position: absolute; left: 60px; right: 60px; top: 150px; text-align: center; font-weight: 700; font-size: 54px; letter-spacing: -1.2px; color: #14161c; line-height: 1.15; }
      #title em { font-style: normal; color: #2f5bff; }
      .hud { position: absolute; display: flex; align-items: center; gap: 18px; padding: 14px 26px; border-radius: 40px; background: rgba(255,255,255,0.92);
        box-shadow: 0 8px 28px rgba(30,40,80,0.12); transform: translateX(-50%); white-space: nowrap; }
      .hud .st { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 30px; }
      .hud .dot { width: 16px; height: 16px; border-radius: 50%; }
      .hud .sep { width: 2px; height: 36px; background: #dfe3ea; }
      .hud .val { font-weight: 700; font-size: 44px; color: #14161c; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
      .hud .unit { font-weight: 500; font-size: 26px; color: #8a90a0; margin-left: 6px; }
      .lbl { position: absolute; height: 0; }
      .lbl .pt { position: absolute; left: -7px; top: -7px; width: 14px; height: 14px; border-radius: 50%; background: #14161c; border: 3px solid #fff; }
      .lbl .ln { position: absolute; top: -1.5px; height: 3px; background: #14161c; }
      .lbl .tx { position: absolute; top: -30px; padding: 6px 12px; font-weight: 800; font-size: 26px; letter-spacing: 3px; color: #14161c; background: rgba(255,255,255,0.94); border-bottom: 3px solid #14161c; white-space: nowrap; }
      #note { position: absolute; left: 40px; top: 1645px; padding: 7px 14px; border-radius: 8px; background: rgba(255,255,255,0.8); font-weight: 500; font-size: 22px; color: #6b7183; }
      #card { position: absolute; left: 70px; top: 470px; width: 470px; padding: 26px 30px; border-radius: 22px; background: rgba(255,255,255,0.95); box-shadow: 0 14px 40px rgba(30,40,80,0.14); }
      #card .k { font-weight: 800; font-size: 22px; letter-spacing: 3px; color: #6b7183; }
      #card .big { font-weight: 800; font-size: 96px; letter-spacing: -3px; color: #14161c; line-height: 1.05; margin-top: 6px; }
      #card .sub { font-weight: 600; font-size: 30px; color: #2f5bff; }
      #card .bar { margin-top: 18px; height: 12px; border-radius: 6px; background: #e4e8f0; overflow: hidden; }
      #card .bar i { display: block; height: 100%; width: 0; background: #2f5bff; border-radius: 6px; }
      #card .barl { display: flex; justify-content: space-between; margin-top: 8px; font-weight: 600; font-size: 22px; color: #8a90a0; }
      #cta { position: absolute; left: 0; right: 0; top: 1520px; text-align: center; font-weight: 600; font-size: 34px; color: #4a5060; }
      #rew { position: absolute; right: 60px; top: 300px; font-weight: 800; font-size: 34px; letter-spacing: 2px; color: #2f5bff; }
      #captions-host { z-index: 10; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="60" data-width="1080" data-height="1920" data-fps="30">
      <div id="world" class="clip" data-start="0" data-duration="60" data-track-index="0" data-track-kind="graphics" data-layout-ignore>
        <canvas id="world-canvas" width="1080" height="1920"></canvas>
      </div>
      <div id="ui" class="clip" data-start="0" data-duration="60" data-track-index="2" data-track-kind="graphics" data-layout-ignore>
        <div class="fade-top"></div><div class="fade-bot"></div>
        <div id="title"></div>
        <div class="hud" id="hud-main"><div class="st"><span class="dot"></span><span class="sl"></span></div><span class="sep"></span><div><span class="val"></span><span class="unit"></span></div></div>
        <div class="hud" id="hud-a"><div class="st"><span class="dot"></span><span class="sl"></span></div><span class="sep"></span><div><span class="val"></span><span class="unit"></span></div></div>
        <div class="hud" id="hud-b"><div class="st"><span class="dot"></span><span class="sl"></span></div><span class="sep"></span><div><span class="val"></span><span class="unit"></span></div></div>
        <div id="labels"></div>
        <div id="note"></div>
        <div id="card"><div class="k">PERIUK NASI AUTOMATIK PERTAMA</div><div class="big">1955</div><div class="sub">Jepun</div>
          <div class="bar"><i></i></div><div class="barl"><span>1955</span><span>70+ tahun, prinsip sama</span><span>2026</span></div></div>
        <div id="cta">Barang apa nak aku bedah lepas ni? ↓</div>
        <div id="rew">◀◀ UNDUR</div>
      </div>
      <div id="captions-host" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="60"
        data-track-index="3" data-track-kind="captions" data-width="1080" data-height="1920"></div>
    </div>

    <script>
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      let resolveWorld;
      window.__hf.buildReady["world"] = new Promise((r) => (resolveWorld = r));
    </script>
    <script type="module">
      import { createWorld } from "./assets/world.js";
      import { warp } from "./assets/timing.js";
      const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
      const scale = Number(vars.previewScale) || 1;
      await Promise.all(["500", "600", "700", "800"].map((w) => document.fonts.load(`${w} 40px "Inter"`)));
      let fxOpts = {}; try { fxOpts = vars.fx ? JSON.parse(vars.fx) : {}; } catch (e) {}
      const world = createWorld(document.getElementById("world-canvas"), 1080, 1920, scale, fxOpts);
      const T = world.T;

      const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
      const ss = (e0, e1, x) => { const u = clamp((x - e0) / (e1 - e0)); return u * u * (3 - 2 * u); };
      const win = (t, t0, t1, fin = 0.3, fout = 0.3) => (t0 <= 0 ? 1 : ss(t0, t0 + fin, t)) * (t1 >= 60 ? 1 : 1 - ss(t1 - fout, t1, t));

      const HOOK = "Kosong, tapi <em>“dah masak”</em>?";
      const CH = [
        [0, 6, HOOK], [6, 12, "Periuk <em>tak tahu</em> nasi masak"], [12, 22, "Suspek: <em>dua magnet</em>"], [22, 38, "Air = <em>brek suhu</em>"],
        [38, 46, "Soalan dia cuma satu: <em>air habis?</em>"], [46, 52, "Bukan periuk. <em>Sukatan.</em>"], [52, 57.4, "Sejak <em>1955</em>, masih sama"], [57.4, 60, HOOK],
      ];
      const NOTES = [[12.2, 22, "Termostat magnet periuk nasi mekanikal · dipermudahkan"], [22.2, 38, "Takat didih air pada paras laut · titik Curie ferit ≈ 103°C"], [52.2, 57.2, "Periuk nasi elektrik automatik pertama · Jepun, 1955"]];
      const LABELS = [
        ["B.button", "BUTANG", 13.4, 16.3, 1], ["B.magnet", "MAGNET KEKAL", 16.4, 21.9, -1], ["B.ferrite", "MAGNET FERIT", 18.1, 21.9, 1], ["B.heater", "PEMANAS", 20.6, 21.9, 1],
        ["A.water", "AIR", 24.2, 30.0, 1], ["B.ferrite", "FERIT 103°C", 33.6, 37.8, -1], ["A.water", "AIR", 38.8, 42.4, 1],
        ["bowl.soft", "AIR +", 47.0, 51.9, -1], ["bowl.hard", "AIR −", 48.7, 51.9, 1],
      ];
      const ST = { off: ["Mati", "#9aa0ad"], cook: ["Memasak", "#ff7a1a"], boil: ["Mendidih", "#2f5bff"], dry: ["Kering", "#e5483a"], warm: ["Warm", "#22a95b"], rew: ["Undur", "#2f5bff"] };

      const $ = (s) => document.querySelector(s);
      const titleEl = $("#title"), noteEl = $("#note"), labelsEl = $("#labels"), card = $("#card"), cta = $("#cta"), rew = $("#rew");
      const lblEls = LABELS.map(() => { const d = document.createElement("div"); d.className = "lbl"; d.innerHTML = '<span class="ln"></span><span class="pt"></span><span class="tx"></span>'; labelsEl.appendChild(d); return d; });
      function setHud(el, st, val, unit, x, y, a) {
        el.style.opacity = a; el.style.left = x + "px"; el.style.top = y + "px";
        const [name, col] = ST[st]; el.querySelector(".dot").style.background = col; el.querySelector(".dot").style.boxShadow = `0 0 0 5px ${col}22`;
        el.querySelector(".sl").textContent = name; el.querySelector(".sl").style.color = col;
        el.querySelector(".val").textContent = val; el.querySelector(".unit").textContent = unit;
      }
      const fmt = (v) => v.toFixed(1).replace(".", ",");

      function overlay(o, t) {
        // title: blur cross-fade between chapters
        const ch = CH.find(([a, b]) => t >= a && t < b) || CH[CH.length - 1];
        const ta = win(t, ch[0], ch[1], 0.35, 0.3);
        if (titleEl.innerHTML !== ch[2]) titleEl.innerHTML = ch[2];
        titleEl.style.opacity = ta; titleEl.style.filter = `blur(${(1 - ta) * 10}px)`;
        // main HUD
        const hm = $("#hud-main");
        let a = 1, st = "warm", val = "0", unit = "g beras";
        if (t < T.hookClick) st = "cook";
        else if (t < T.rewOn) st = "warm";
        else if (t < T.rewEnd) { st = "rew"; val = fmt(o.B.temp); unit = "°C"; }
        else if (t < T.split0) { st = o.B.status; val = fmt(o.B.temp); unit = "°C"; a = 1 - ss(T.split0 - 0.2, T.split0 + 0.2, t); }
        else if (t < T.merge0) { a = 0; }
        else if (t < T.bowls0 + 0.6) { st = o.A.status; val = fmt(o.A.temp); unit = "°C"; a = ss(T.merge0, T.merge0 + 0.5, t) * (1 - ss(T.bowls0, T.bowls0 + 0.5, t)); }
        else if (t < 55.4) { a = 0; }
        else { st = "cook"; a = ss(55.4, 56.0, t); }
        setHud(hm, st, val, unit, 540, 300, a);
        // split HUDs over each cooker
        const sa = ss(T.split1 - 0.6, T.split1, t) * (1 - ss(T.merge0 - 0.1, T.merge0 + 0.3, t));
        const pa = o.anchors["A.top"], pb = o.anchors["B.top"];
        setHud($("#hud-a"), o.A.status, fmt(o.A.temp), "°C", pa ? clamp(pa[0], 200, 880) : 270, 560, sa);
        setHud($("#hud-b"), o.B.status, fmt(o.B.temp), "°C", pb ? clamp(pb[0], 200, 880) : 810, 560, sa);
        // labels
        LABELS.forEach(([k, txt, t0, t1, side], i) => {
          const el = lblEls[i], p = o.anchors[k]; const la = p ? win(t, t0, t1, 0.25, 0.25) : 0;
          el.style.opacity = la; if (la <= 0) return;
          el.style.left = p[0] + "px"; el.style.top = p[1] + "px";
          const L = 110 * ss(t0, t0 + 0.35, t);
          const ln = el.querySelector(".ln"), tx = el.querySelector(".tx");
          ln.style.width = L + "px"; ln.style.left = side > 0 ? "0px" : -L + "px";
          if (tx.textContent !== txt) tx.textContent = txt;
          tx.style.left = side > 0 ? L + "px" : "auto"; tx.style.right = side > 0 ? "auto" : L + "px";
        });
        // source note
        const n = NOTES.find(([a, b]) => t >= a && t < b);
        noteEl.style.opacity = n ? win(t, n[0], n[1]) : 0; if (n && noteEl.textContent !== n[2]) noteEl.textContent = n[2];
        // 1955 card
        const ca = win(t, 53.2, 57.0, 0.35, 0.35); card.style.opacity = ca; card.style.transform = `translateY(${(1 - ss(53.2, 53.6, t)) * 24}px)`;
        card.querySelector(".bar i").style.width = 100 * ss(54.6, 56.2, t) + "%";
        cta.style.opacity = win(t, 57.6, 59.5, 0.3, 0.4);
        rew.style.opacity = t > T.rewOn && t < T.rewEnd ? (Math.floor(t * 4) % 2 ? 1 : 0.35) : 0;
      }
      function renderAt(t) { const ct = warp(t); const o = world.render(ct); overlay(o, ct); }
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      renderAt(0);
      resolveWorld();
    </script>
  </body>
</html>
