<!doctype html>

<style>

*{margin:0;padding:0;box-sizing:border-box}

#title{position:absolute;left:80px;right:80px;top:1020px;font-weight:900;font-size:124px;letter-spacing:-5px;line-height:.92}
#title .s{display:block;font-size:84px;letter-spacing:-3px;margin-bottom:14px}
