<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url(../assets/fonts/inter-latin-800-normal.woff2);font-weight:800}
*{margin:0;box-sizing:border-box}body{width:1080px;height:1920px;overflow:hidden;background:#05070b;font-family:Inter}
.bg{position:absolute;inset:0;background:url(cover-bg.jpg) center/cover;filter:brightness(.8)}
.vg{position:absolute;inset:0;background:linear-gradient(#05070b 0%,rgba(5,7,11,.35) 22%,rgba(5,7,11,.1) 45%,rgba(5,7,11,.6) 72%,#05070b 94%)}
.t{position:absolute;top:140px;left:0;right:0;text-align:center;color:#f6f3ec;text-shadow:0 6px 30px rgba(0,0,0,.9)}
.k{font:800 48px Inter;letter-spacing:6px;color:#ffce00}.big{font:800 112px/0.98 Inter;letter-spacing:-3px;margin-top:10px}.big span{color:#ffce00}
.logos{position:absolute;top:1230px;left:0;right:0;display:flex;justify-content:center;gap:16px}
.logos div{position:relative;width:150px;height:150px;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center}
.logos img{max-width:130px;max-height:130px}
.logos div::after{content:"";position:absolute;left:-8px;right:-8px;top:50%;height:12px;background:#ff2d46;transform:rotate(-20deg);border-radius:6px;box-shadow:0 0 12px rgba(0,0,0,.6)}
.fig{position:absolute;right:60px;top:650px;height:540px;filter:drop-shadow(0 20px 30px rgba(0,0,0,.7))}
.n{position:absolute;top:1450px;left:0;right:0;text-align:center;font:800 56px/1.15 Inter;color:#fff}.n span{color:#ff4d5e}
</style></head><body><div class="bg"></div><div class="vg"></div>
<div class="t"><div class="k">PRN SARAWAK · 12 DIS</div><div class="big">SARAWAK UNTUK<br><span>ORANG SARAWAK?</span></div></div>
<img class="fig" src="../assets/leaders/johari-fig.png">
<div class="logos"><div><img src="../assets/logos/pkr.png"></div><div><img src="../assets/logos/amanah.png"></div><div><img src="../assets/logos/bn.png"></div><div><img src="../assets/logos/pas.png"></div><div><img src="../assets/logos/bersatu.png"></div></div>
<div class="n">Hampir semua parti Semenanjung<br><span>tak bertanding?</span></div>
</body></html>
